<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam's Virtual Office · Autonomous Collaborative Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1b2130;
  --panel: rgba(22, 27, 38, .88);
  --line: #323c50;
  --ink: #eef2f8;
  --muted: #98a4b8;
  --work: #27c46a;
  --recent: #f2a71b;
  --idle: #8a94a6;
  --blocked: #ff5252;
  --off: #e25555;
  --accent: #3d7bff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 600 13px/1.35 Nunito, system-ui, sans-serif;
  user-select: none;
}
#stage { position: fixed; inset: 0; cursor: grab; }
#stage.drag { cursor: grabbing; }
#labels { position: fixed; inset: 0; pointer-events: none; }
.fred { font-family: Fredoka, Nunito, sans-serif; }

/* Top HUD (Compact Single-Row Design) */
.hud {
  position: fixed;
  left: 10px;
  right: 10px;
  top: 8px;
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  align-items: center;
  z-index: 5;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.box {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
}
.brand {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font: 700 13.5px/1 Fredoka, sans-serif;
  letter-spacing: .2px;
  white-space: nowrap;
}
.brand i {
  width: 18px;
  height: 18px;
  border-radius: 5px;
  background: linear-gradient(135deg, #e53935, #ff6b6b);
  display: grid;
  place-items: center;
  transform: rotate(-6deg);
  box-shadow: 0 2px 5px rgba(229, 57, 53, .3);
}
.brand i::after {
  content: "";
  width: 7px;
  height: 7px;
  background: #fff;
  border-radius: 2px;
}

.stats { display: flex; gap: 0; padding: 3px 6px; align-items: center; white-space: nowrap; }
.stat { padding: 1px 7px; border-right: 1px solid var(--line); }
.stat:last-child { border: 0; }
.stat small { display: block; color: var(--muted); font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; line-height: 1; margin-bottom: 2px; }
.stat b { font: 700 12.5px/1 Fredoka, sans-serif; }
.stat b.up { color: #16a34a; }
.stat b.warn { color: #d97706; }

.tabs { display: flex; gap: 2px; padding: 3px 5px; flex-wrap: nowrap; align-items: center; white-space: nowrap; }
.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 700 11px Nunito, sans-serif;
  padding: 3px 7px;
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all .15s ease;
}
.tab:hover { color: var(--ink); background: rgba(0, 0, 0, .05); }
.tab[aria-pressed="true"] { background: var(--accent); color: #fff; box-shadow: 0 1px 5px rgba(37, 99, 235, .35); }
.tab .ic {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  background: rgba(255, 255, 255, .2);
  display: grid;
  place-items: center;
  font-size: 9px;
}

.tools { display: flex; gap: 4px; padding: 3px 5px; margin-left: auto; align-items: center; white-space: nowrap; }
.btn {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, .4);
  color: var(--ink);
  font: 700 11px Nunito, sans-serif;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all .15s ease;
}
.btn:hover { background: rgba(255, 255, 255, .8); border-color: rgba(0, 0, 0, .15); }
.btn[aria-pressed="true"] { background: #f59e0b; color: #1b1b1b; border-color: #f59e0b; font-weight: 800; }


/* Legend & Footer (Compact Mini-Card) */
.legend {
  position: fixed;
  left: 10px;
  bottom: 10px;
  z-index: 5;
  display: flex;
  gap: 9px;
  padding: 4px 10px;
  flex-wrap: wrap;
  max-width: calc(100vw - 320px);
  border-radius: 8px;
  backdrop-filter: blur(8px);
}
.legend span { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 600; }
.dot { width: 6.5px; height: 6.5px; border-radius: 50%; display: inline-block; flex: none; }
.d-working { background: var(--work); box-shadow: 0 0 0 2px rgba(39, 196, 106, .35); }
.d-recent { background: var(--recent); }
.d-idle { background: var(--idle); }
.d-blocked { background: var(--blocked); box-shadow: 0 0 0 2px rgba(255, 82, 82, .4); }
.d-offline { background: var(--off); }
.hint { color: var(--muted); font-size: 9.5px; opacity: .75; }

.upd {
  position: fixed;
  right: 12px;
  bottom: 12px;
  z-index: 5;
  padding: 8px 14px;
  color: var(--muted);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.upd .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--work); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: .4; } 100% { opacity: 1; } }

/* CSS2D Overlays - Character Floating Name Badges */
.lbl {
  pointer-events: auto;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transform: translateY(-100%);
  margin-bottom: 8px;
  user-select: none;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
}
.lbl:hover {
  transform: translateY(calc(-100% - 4px)) scale(1.08);
  z-index: 1000 !important;
}

/* User Toggle: Hides badges completely when enabled */
body.labels-hidden #labels .lbl {
  display: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
}

/* Bright High-Contrast Pill Name Badge (Warna Terang, Glowing & Jelas) */
.lbl .name-badge,
.lbl .name {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: rgba(15, 23, 42, 0.94);
  color: #ffffff !important;
  font: 800 12px/1.2 'Nunito', 'Segoe UI', -apple-system, sans-serif;
  letter-spacing: 0.4px;
  padding: 4px 12px;
  border-radius: 20px;
  border: 1.5px solid rgba(255, 255, 255, 0.4);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 10px rgba(56, 189, 248, 0.35);
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  transition: all 0.2s ease;
}

.lbl:hover .name-badge,
.lbl:hover .name {
  border-color: rgba(255, 255, 255, 0.8);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6), 0 0 16px rgba(56, 189, 248, 0.6);
}

.lbl .status-dot,
.lbl .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 8px #22c55e;
  display: inline-block;
  flex-shrink: 0;
}

/* Bright Role Subtitle Tag */
.lbl .role-tag,
.lbl .role {
  display: inline-block;
  background: rgba(15, 23, 42, 0.88);
  color: #38bdf8;
  font: 800 9.5px/1.2 'Nunito', sans-serif;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid rgba(56, 189, 248, 0.45);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
}

/* Status Indicator Colors */
.lbl.state-working .status-dot, .lbl.state-working .dot { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
.lbl.state-recent .status-dot, .lbl.state-recent .dot { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
.lbl.state-idle .status-dot, .lbl.state-idle .dot { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }
.lbl.state-blocked .status-dot, .lbl.state-blocked .dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
.lbl.state-offline .status-dot, .lbl.state-offline .dot { background: #94a3b8; box-shadow: 0 0 6px #94a3b8; }

/* Vibrant, Agent-Themed High-Visibility Colors */
.lbl-kamala .name-badge, .lbl-kamala .name {
  color: #ffffff !important;
  background: linear-gradient(135deg, rgba(185, 28, 28, 0.95), rgba(15, 23, 42, 0.95));
  border-color: #f87171;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 14px rgba(239, 68, 68, 0.5);
}
.lbl-kamala .role-tag, .lbl-kamala .role {
  color: #fca5a5;
  border-color: rgba(239, 68, 68, 0.5);
  background: rgba(127, 29, 29, 0.85);
}

.lbl-devin .name-badge, .lbl-devin .name {
  color: #ffffff !important;
  background: linear-gradient(135deg, rgba(2, 132, 199, 0.95), rgba(15, 23, 42, 0.95));
  border-color: #38bdf8;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 14px rgba(56, 189, 248, 0.5);
}
.lbl-devin .role-tag, .lbl-devin .role {
  color: #7dd3fc;
  border-color: rgba(56, 189, 248, 0.5);
  background: rgba(3, 105, 161, 0.85);
}

.lbl-audit .name-badge, .lbl-audit .name {
  color: #ffffff !important;
  background: linear-gradient(135deg, rgba(22, 163, 74, 0.95), rgba(15, 23, 42, 0.95));
  border-color: #4ade80;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 14px rgba(34, 197, 94, 0.5);
}
.lbl-audit .role-tag, .lbl-audit .role {
  color: #86efac;
  border-color: rgba(34, 197, 94, 0.5);
  background: rgba(20, 83, 45, 0.85);
}

.lbl-rani .name-badge, .lbl-rani .name {
  color: #ffffff !important;
  background: linear-gradient(135deg, rgba(147, 51, 234, 0.95), rgba(15, 23, 42, 0.95));
  border-color: #c084fc;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 14px rgba(168, 85, 247, 0.5);
}
.lbl-rani .role-tag, .lbl-rani .role {
  color: #d8b4fe;
  border-color: rgba(168, 85, 247, 0.5);
  background: rgba(88, 28, 135, 0.85);
}

.lbl-aura .name-badge, .lbl-aura .name {
  color: #ffffff !important;
  background: linear-gradient(135deg, rgba(217, 119, 6, 0.95), rgba(15, 23, 42, 0.95));
  border-color: #fbbf24;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 14px rgba(245, 158, 11, 0.5);
}
.lbl-aura .role-tag, .lbl-aura .role {
  color: #fde047;
  border-color: rgba(245, 158, 11, 0.5);
  background: rgba(120, 53, 15, 0.85);
}

.lbl-raka .name-badge, .lbl-raka .name {
  color: #ffffff !important;
  background: linear-gradient(135deg, rgba(71, 85, 105, 0.95), rgba(15, 23, 42, 0.95));
  border-color: #94a3b8;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 14px rgba(148, 163, 184, 0.5);
}
.lbl-raka .role-tag, .lbl-raka .role {
  color: #93c5fd;
  border-color: rgba(59, 130, 246, 0.5);
  background: rgba(30, 58, 138, 0.85);
}

/* Subagent Dynamic Badges */
.lbl[class*="sub-"] .name-badge, .lbl.is-subagent .name-badge {
  color: #ffffff !important;
  background: linear-gradient(135deg, rgba(14, 165, 233, 0.95), rgba(88, 28, 135, 0.95));
  border-color: #38bdf8;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 16px rgba(56, 189, 248, 0.6);
}
.lbl[class*="sub-"] .role-tag, .lbl.is-subagent .role-tag {
  color: #e9d5ff;
  border-color: rgba(192, 132, 252, 0.5);
  background: rgba(88, 28, 135, 0.85);
}

.bub {
  max-width: 210px;
  background: #ffffff;
  color: #1c2230;
  border-radius: 10px;
  padding: 5px 9px;
  font: 700 11.5px/1.3 Nunito, sans-serif;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
  position: relative;
  text-align: center;
  transition: opacity .2s ease;
}
.bub::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  width: 9px;
  height: 9px;
  background: #ffffff;
  transform: translateX(-50%) rotate(45deg);
}
.bub:empty { display: none; }
.bub.warn { background: #ffe08a; border: 1px solid #e5b324; }
.bub.warn::after { background: #ffe08a; }
.bub.blocked { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
.bub.blocked::after { background: #ffebee; }

.sign {
  pointer-events: none;
  text-align: center;
  background: rgba(14, 18, 26, .88);
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 10px;
  padding: 6px 14px;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
}
.sign b { font: 700 15px Fredoka, sans-serif; display: block; }
.sign span { color: #aab4c6; font-size: 11px; font-weight: 700; }
.sign.lobby { background: #1f365d; border-color: #3d7bff; color: #d6e4ff; }
.sign.med { background: #ffffff; border-color: #e53935; color: #c62828; }
.sign.med span { color: #5b667a; }
.sign.yard { background: #22381f; border-color: #5da83a; color: #c7f0b8; }
.sign.yard span { color: #9bc68d; }

/* Dialog Modal Glassmorphism */
dialog {
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  padding: 0;
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  color: var(--ink);
  width: min(620px, calc(100vw - 32px));
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
  overflow: hidden;
  animation: modalPopIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
dialog::backdrop {
  background: rgba(4, 7, 15, 0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
@keyframes modalPopIn {
  from { opacity: 0; transform: scale(0.94) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-tab-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  padding: 7px 14px;
  border-radius: 8px;
  font: 700 12.5px 'Nunito', sans-serif;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}
.modal-tab-btn:hover {
  color: #f1f5f9;
  background: rgba(255, 255, 255, 0.05);
}
.modal-tab-btn.active {
  color: #38bdf8;
  background: rgba(56, 189, 248, 0.12);
  box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.3);
}

.thought-timeline-item {
  position: relative;
  padding-left: 20px;
}
.thought-timeline-item::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #38bdf8;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
}
.thought-timeline-item::after {
  content: '';
  position: absolute;
  left: 7px;
  top: 18px;
  bottom: -10px;
  width: 1px;
  background: rgba(255, 255, 255, 0.1);
}
.thought-timeline-item:last-child::after {
  display: none;
}

.dh {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, .02);
}
.dh h3 { margin: 0; font: 700 22px Fredoka, sans-serif; letter-spacing: .3px; }
.dh .btn { margin-left: auto; }
.db { padding: 18px 20px 22px; display: grid; gap: 12px; }
.kv { display: grid; grid-template-columns: 135px 1fr; gap: 8px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 700; }
.kv dd { margin: 0; word-break: break-word; }
.quote {
  background: #151a25;
  border-left: 4px solid var(--work);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12.5px;
  white-space: pre-wrap;
  max-height: 180px;
  overflow: auto;
  line-height: 1.45;
}
.quote.warn { border-left-color: var(--recent); }
.quote.blocked { border-left-color: var(--blocked); }

@media (max-width: 760px) {
  .stats .stat:nth-child(n+3) { display: none; }
  .legend { display: none; }
  .hud { left: 8px; right: 8px; top: 8px; gap: 6px; }
  .brand { font-size: 15px; padding: 5px 10px; }
  .stat { padding: 2px 9px; }
  .tabs { order: 5; flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 5px 10px; white-space: nowrap; font-size: 12px; }
  .tools { margin-left: auto; }
  .btn { padding: 5px 9px; font-size: 12px; }
  .upd { right: 8px; bottom: 8px; font-size: 11px; padding: 6px 10px; }
}
</style>

  }
}
</script>

<body>
<div id="stage"></div>
<div id="labels"></div>

<div class="hud">
  <div class="box brand"><i></i>Sam's Virtual Office</div>
  <div class="box stats">
    <div class="stat"><small>Agent aktif</small><b id="sAct">5/6</b></div>
    <div class="stat"><small>Task 24j</small><b id="sSes" class="up">38</b></div>
    <div class="stat" id="sApproveBox" title="Klik untuk cek task pending"><small>Approval</small><b id="sApprove" class="warn">0 pending</b></div>
  </div>
  <div class="box tabs" id="tabs"></div>
  <div class="box tools">
    <button class="btn" id="btnToggleLabels" aria-pressed="true" title="Tampilkan / sembunyikan badge nama karakter di atas kepala (Shortcut: N atau H)">🏷️ Label: On</button>
    <button class="btn" id="btnSuperpowers" aria-pressed="true" title="Buka/Tutup Superpowers HUD Panel">⚡ Superpowers</button>
    <button class="btn" id="walls" aria-pressed="false" title="Dinding depan & kanan: kaca transparan / tembok penuh">🧱 Tembok</button>
    <button class="btn" id="demo" aria-pressed="false" title="Percepat simulasi task & aktivitas">🎬 Demo</button>
    <button class="btn" id="btnBoard" title="Buka Task Board ringkas">📋 Task Board</button>
    <button class="btn" id="btnReset" title="Kembalikan sudut kamera">🔄 Reset</button>
  </div>
</div>

<div class="box legend">
  <span><i class="dot d-working"></i>Sedang kerja</span>
  <span><i class="dot d-recent"></i>Baru selesai (ngopi)</span>
  <span><i class="dot d-idle"></i>Santai</span>
  <span><i class="dot d-blocked"></i>Waiting approval</span>
  <span><i class="dot d-offline"></i>Offline / Server Maintenance</span>
  <span class="hint">· seret kiri = geser · klik kanan seret = putar · scroll = zoom · klik agent = buka detail</span>
</div>

<div class="box upd" id="upd"><i class="live-dot"></i><span>Terhubung · Simulasi aktif</span></div>
<div id="err" class="fred"></div>

<dialog id="dlg">
  <div class="dh">
    <span id="dEmoji" style="font-size:28px"></span>
    <h3 id="dName">Agent Detail</h3>
    <button class="btn" onclick="dlg.close()">✕</button>
  </div>
  <div class="db" id="dBody"></div>
</dialog>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { eventBus } from "./js/event-bus.js";
import { WhiteboardDisplay } from "./js/whiteboard-display.js";
import { SubagentSpawner } from "./js/subagent-spawner.js";
import { SuperpowersWorkflowEngine } from "./js/superpowers-engine.js";
import { initSuperpowersUI } from "./js/superpowers-ui.js";
import { LiveStateListener } from "./js/live-state-listener.js";

// ==========================================
// 1. TEXTURES & SCREENS ENGINE
// ==========================================
/**
 * textures.js - Procedural Canvas Textures & Screen Canvas Engine
 * AI Agent Virtual Office 3D Mockup
 */

/**
 * Creates an HTML Canvas in browser environments or a fully-featured mock canvas in Node.js
 * @param {number} w Width in pixels
 * @param {number} h Height in pixels
 * @returns {HTMLCanvasElement|object}
 */
function createCanvas(w = 256, h = 256) {
  if (typeof document !== 'undefined' && document.createElement) {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    return canvas;
  }

  // Node.js mock canvas & 2D rendering context
  const mockCtx = {
    fillStyle: '#000000',
    strokeStyle: '#000000',
    lineWidth: 1,
    font: '10px sans-serif',
    textAlign: 'left',
    textBaseline: 'alphabetic',
    shadowColor: 'rgba(0,0,0,0)',
    shadowBlur: 0,
    shadowOffsetX: 0,
    shadowOffsetY: 0,
    lineJoin: 'miter',
    lineCap: 'butt',
    globalAlpha: 1.0,
    globalCompositeOperation: 'source-over',

    fillRect(x, y, w, h) {},

    clearRect(x, y, w, h) {},
    fillText(text, x, y, maxWidth) {},
    strokeText(text, x, y, maxWidth) {},
    measureText(text) {
      const str = text !== undefined && text !== null ? String(text) : '';
      return { width: str.length * 7 };
    },
    beginPath() {},
    closePath() {},
    moveTo(x, y) {},
    lineTo(x, y) {},
    arc(x, y, radius, startAngle, endAngle, anticlockwise) {},
    arcTo(x1, y1, x2, y2, radius) {},
    ellipse(x, y, rx, ry, rot, start, end) {},
    bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x, y) {},
    quadraticCurveTo(cpx, cpy, x, y) {},
    rect(x, y, w, h) {},
    roundRect(x, y, w, h, radii) {},
    stroke() {},
    fill() {},
    clip() {},
    save() {},
    restore() {},
    translate(x, y) {},
    rotate(angle) {},
    scale(x, y) {},
    transform() {},
    setTransform() {},
    resetTransform() {},
    drawImage() {},
    createLinearGradient(x0, y0, x1, y1) {
      return { addColorStop(offset, color) {} };
    },
    createRadialGradient(x0, y0, r0, x1, y1, r1) {

    },
    createPattern() {

    },
    getImageData(sx, sy, sw, sh) {

  const mockCanvas = {
    width: w,

    toDataURL(type) {

    },

  return mockCanvas;
}

/**
 * Wraps a canvas into a THREE.CanvasTexture or mock texture
 */
function wrapTexture(canvas, THREE) {
  if (THREE && typeof THREE.CanvasTexture === 'function') {
    const tex = new THREE.CanvasTexture(canvas);
    tex.canvas = canvas;
    return tex;
  }
  return {
    isTexture: true,
    isCanvasTexture: true,
    image: canvas,
    canvas: canvas,
    needsUpdate: false,
    wrapS: THREE?.RepeatWrapping ?? 1000,
    wrapT: THREE?.RepeatWrapping ?? 1000,
    repeat: {
      x: 1,
      y: 1,
      set(x, y) {
        this.x = x;
        this.y = y;
      }
    },
    magFilter: THREE?.LinearFilter ?? 1006,
    minFilter: THREE?.LinearMipmapLinearFilter ?? 1008
  };
}

function drawFloorParquet(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Background warm base
  ctx.fillStyle = '#b37e47';
  ctx.fillRect(0, 0, w, h);

  const numRows = 8;
  const rowHeight = h / numRows;
  const woodShades = ['#ba854e', '#c4935a', '#a8743f', '#cb9a61', '#9f6b36', '#bd8951'];

  for (let r = 0; r < numRows; r++) {
    const y = r * rowHeight;
    const rowOffset = (r % 2 === 0) ? 0 : 40;
    const plankWidth = 80;

    for (let x = -plankWidth + rowOffset; x < w + plankWidth; x += plankWidth) {
      const shadeIndex = Math.abs(Math.sin(r * 13 + x * 7)) * woodShades.length | 0;
      ctx.fillStyle = woodShades[shadeIndex % woodShades.length];
      ctx.fillRect(x, y, plankWidth, rowHeight);

      // Plank border seams
      ctx.strokeStyle = '#5a3818';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, plankWidth, rowHeight);

      // Subtle internal wood grain lines
      ctx.strokeStyle = 'rgba(70, 40, 15, 0.15)';
      ctx.beginPath();
      ctx.moveTo(x + 5, y + rowHeight * 0.35);
      ctx.lineTo(x + plankWidth - 5, y + rowHeight * 0.38);
      ctx.moveTo(x + 10, y + rowHeight * 0.7);
      ctx.lineTo(x + plankWidth - 10, y + rowHeight * 0.68);
      ctx.stroke();
    }
  }
}

function drawHallTiles(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Slate modern office tiles
  ctx.fillStyle = '#2a324b';
  ctx.fillRect(0, 0, w, h);

  const tileSize = 64;
  for (let x = 0; x < w; x += tileSize) {
    for (let y = 0; y < h; y += tileSize) {
      // Tile background with subtle gradient
      ctx.fillStyle = '#2f3854';
      ctx.fillRect(x + 1, y + 1, tileSize - 2, tileSize - 2);

      // Tile bevel highlight
      ctx.strokeStyle = '#414d72';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x + 1, y + tileSize - 1);
      ctx.lineTo(x + 1, y + 1);
      ctx.lineTo(x + tileSize - 1, y + 1);
      ctx.stroke();

      // Tile bevel shadow
      ctx.strokeStyle = '#1a1f30';
      ctx.beginPath();
      ctx.moveTo(x + tileSize - 1, y + 1);
      ctx.lineTo(x + tileSize - 1, y + tileSize - 1);
      ctx.lineTo(x + 1, y + tileSize - 1);
      ctx.stroke();

      // Center accent dot
      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.fillRect(x + tileSize / 2 - 2, y + tileSize / 2 - 2, 4, 4);
    }
  }
}

function drawCrossSymbol(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Clean white rounded container
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);

  // Soft grey border

  ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, w - 4, h - 4);

  // Bright red cross (+)
  const cx = w / 2;

}

function drawCodeScreen(canvas, state) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Terminal background
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, w, h);

  // Top window header
  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, w, 24);

  // Window dots (red, yellow, green)
  ctx.fillStyle = '#ff5f56';
  ctx.beginPath();
  ctx.arc(12, 12, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffbd2e';
  ctx.beginPath();
  ctx.arc(24, 12, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#27c93f';
  ctx.beginPath();
  ctx.arc(36, 12, 4, 0, Math.PI * 2);
  ctx.fill();

  // Header title
  ctx.fillStyle = '#8b949e';
  ctx.font = '10px monospace';
  ctx.fillText('agent-runtime.ts', 50, 15);

  // Code gutter
  ctx.fillStyle = '#12161f';
  ctx.fillRect(0, 24, 28, h - 24);

  // Render code lines
  const lines = state.lines;
  const lineHeight = 18;
  const startY = 40;
  const visibleCount = 11;
  const offset = state.lineOffset % lines.length;

  for (let i = 0; i < visibleCount; i++) {
    const lineIndex = (offset + i) % lines.length;
    const line = lines[lineIndex];
    const y = startY + i * lineHeight;

    // Line number in gutter
    ctx.fillStyle = '#484f58';
    ctx.font = '9px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(String(i + 1), 22, y);

    // Code text
    ctx.textAlign = 'left';
    ctx.fillStyle = line.color || '#e6edf3';
    ctx.font = '11px monospace';
    ctx.fillText(line.text, 34, y);
  }

  // Blinking cursor on current line
  if (state.cursorBlink % 2 === 0) {
    const cursorY = startY + (visibleCount - 1) * lineHeight - 10;
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(160, cursorY, 7, 12);
  }
}

function drawTerminalScreen(canvas, state) {
  const ctx = canvas.getContext('2d');

  ctx.fill();

  ctx.arc(24, 12, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#9ca3af';

  ctx.strokeStyle = '#1e293b';

  const lines = state.lines || [];

  const startY = 42;

  for (let i = 0; i < visibleCount && i < lines.length; i++) {

    const cursorY = startY + Math.min(lines.length, visibleCount) * lineHeight - 12;

}

function drawChartScreen(canvas, state) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Dark trading / ops monitor background
  ctx.fillStyle = '#0a0e17';
  ctx.fillRect(0, 0, w, h);

  // Header info bar
  ctx.fillStyle = '#111827';
  ctx.fillRect(0, 0, w, 28);

  ctx.fillStyle = '#f3f4f6';
  ctx.font = 'bold 11px sans-serif';
  ctx.fillText('OPS / BTC CLUSTER', 10, 18);

  const priceColor = state.trendUp ? '#10b981' : '#ef4444';
  ctx.fillStyle = priceColor;
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`$${state.price.toFixed(1)} ${state.trendUp ? '▲ +3.4%' : '▼ -1.2%'}`, w - 10, 18);
  ctx.textAlign = 'left';

  // Grid lines
  ctx.strokeStyle = 'rgba(31, 41, 55, 0.7)';
  ctx.lineWidth = 1;
  for (let y = 45; y < h - 40; y += 30) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  for (let x = 30; x < w; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 28);
    ctx.lineTo(x, h - 30);
    ctx.stroke();
  }

  // Candlesticks
  const candles = state.candles;
  const candleW = 9;
  const gap = 4;
  const startX = 14;
  const chartHeight = 150;
  const chartBottom = 205;

  let minPrice = Infinity;
  let maxPrice = -Infinity;
  candles.forEach(c => {
    if (c.low < minPrice) minPrice = c.low;
    if (c.high > maxPrice) maxPrice = c.high;
  });
  const range = (maxPrice - minPrice) || 1;

  candles.forEach((c, idx) => {
    const x = startX + idx * (candleW + gap);
    const isUp = c.close >= c.open;
    const color = isUp ? '#10b981' : '#ef4444';

    const highY = chartBottom - ((c.high - minPrice) / range) * chartHeight;
    const lowY = chartBottom - ((c.low - minPrice) / range) * chartHeight;
    const openY = chartBottom - ((c.open - minPrice) / range) * chartHeight;
    const closeY = chartBottom - ((c.close - minPrice) / range) * chartHeight;

    // Candle wick
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + candleW / 2, highY);
    ctx.lineTo(x + candleW / 2, lowY);
    ctx.stroke();

    // Candle body
    const bodyTop = Math.min(openY, closeY);
    const bodyHeight = Math.max(Math.abs(closeY - openY), 3);
    ctx.fillStyle = color;
    ctx.fillRect(x, bodyTop, candleW, bodyHeight);

    // Volume bar
    const volHeight = Math.min(c.vol * 1.5, 20);
    ctx.fillStyle = isUp ? 'rgba(16, 185, 129, 0.35)' : 'rgba(239, 68, 68, 0.35)';
    ctx.fillRect(x, h - volHeight - 4, candleW, volHeight);
  });

  // Moving average polyline
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 2;
  ctx.beginPath();
  candles.forEach((c, idx) => {
    const x = startX + idx * (candleW + gap) + candleW / 2;
    const avg = (c.open + c.close) / 2;
    const y = chartBottom - ((avg - minPrice) / range) * chartHeight;
    if (idx === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

function drawGameScreen(canvas, state) {

function drawSleepFace(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Calm sleeping skin
  ctx.fillStyle = '#fed7aa';
  ctx.fillRect(0, 0, w, h);

  // Closed peaceful curved eyes (⌒ ⌒)
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.arc(40, 58, 8, 1.1 * Math.PI, 1.9 * Math.PI, false);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(88, 58, 8, 1.1 * Math.PI, 1.9 * Math.PI, false);
  ctx.stroke();

  // Rosy cheeks
  ctx.fillStyle = 'rgba(244, 114, 182, 0.45)';
  ctx.beginPath();
  ctx.arc(32, 68, 8, 0, Math.PI * 2);
  ctx.arc(96, 68, 8, 0, Math.PI * 2);
  ctx.fill();

  // Peaceful resting mouth
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(64, 80, 5, 0, Math.PI);
  ctx.stroke();

  // Floating 'z Z z' sleeping letters
  ctx.fillStyle = '#3b82f6';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillText('z', 90, 32);
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText('Z', 104, 24);
}

function drawGreyFace(canvas) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  // Offline / desaturated grey skin
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(0, 0, w, h);

  // Sleeping eyes in muted charcoal
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.arc(40, 58, 8, 1.1 * Math.PI, 1.9 * Math.PI, false);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(88, 58, 8, 1.1 * Math.PI, 1.9 * Math.PI, false);
  ctx.stroke();

  // Offline straight mouth
  ctx.beginPath();
  ctx.moveTo(52, 82);
  ctx.lineTo(76, 82);
  ctx.stroke();

  // Muted offline indicator
  ctx.fillStyle = '#64748b';
  ctx.font = 'bold 14px monospace';

/**
 * Creates facial expression textures and character materials
 * @param {object} THREE Three.js library instance
 * @returns {object} { FACES: { smile, focus, sleep }, FACE_M, GREY_FACE }
 */
function createFaces(THREE) {
  // 1. Smile Face Canvas & Texture
  const smileCanvas = createCanvas(128, 128);
  drawSmileFace(smileCanvas);
  const smileTex = wrapTexture(smileCanvas, THREE);

  // 2. Focus Face Canvas & Texture
  const focusCanvas = createCanvas(128, 128);
  drawFocusFace(focusCanvas);
  const focusTex = wrapTexture(focusCanvas, THREE);

  // 3. Sleep Face Canvas & Texture
  const sleepCanvas = createCanvas(128, 128);
  drawSleepFace(sleepCanvas);
  const sleepTex = wrapTexture(sleepCanvas, THREE);

  // 4. Grey Face Canvas & Texture
  const greyCanvas = createCanvas(128, 128);
  drawGreyFace(greyCanvas);
  const greyTex = wrapTexture(greyCanvas, THREE);

  const FACES = {
    smile: smileTex,
    focus: focusTex,
    sleep: sleepTex,
    grey: greyTex
  };

  // Helper to instantiate materials
  function makeMat(tex, color = 0xffffff) {
    if (THREE && typeof THREE.MeshStandardMaterial === 'function') {
      return new THREE.MeshStandardMaterial({
        map: tex,
        color: color,
        roughness: 0.8,
        metalness: 0.1
      });
    }
    if (THREE && typeof THREE.MeshBasicMaterial === 'function') {
      return new THREE.MeshBasicMaterial({
        map: tex,
        color: color
      });
    }
    return {
      isMaterial: true,
      map: tex,
      color: color,
      roughness: 0.8
    };
  }

  const smileMat = makeMat(smileTex);
  const focusMat = makeMat(focusTex);
  const sleepMat = makeMat(sleepTex);
  const greyMat = makeMat(greyTex, 0x94a3b8);

  // FACE_M acts as the default face material while also mapping state keys
  const FACE_M = smileMat;
  FACE_M.smile = smileMat;
  FACE_M.focus = focusMat;
  FACE_M.sleep = sleepMat;

  const GREY_FACE = greyMat;

  return {
    FACES,
    FACE_M,
    GREY_FACE
  };
}

/**
 * Updates code lines animation and btc/ops chart candles
 * @param {object} SCREEN Object containing screen textures
 */
function tickScreens(SCREEN) {
  if (!SCREEN) return;

  // 1. Tick Code Screen
  if (SCREEN.code && SCREEN.code.canvas && SCREEN.code._state) {
    const state = SCREEN.code._state;
    state.step++;

    // Scroll line every 12 frames
    if (state.step % 12 === 0) {
      state.lineOffset++;
    }

    // Blink cursor every 20 frames
    if (state.step % 20 === 0) {
      state.cursorBlink++;
    }

    drawCodeScreen(SCREEN.code.canvas, state);
    SCREEN.code.needsUpdate = true;
  }

  // 2. Tick Chart Screen
  if (SCREEN.chart && SCREEN.chart.canvas && SCREEN.chart._state) {
    const state = SCREEN.chart._state;
    state.step++;

    // Add or update candles every 15 frames
    if (state.step % 15 === 0) {
      const candles = state.candles;
      const lastCandle = candles[candles.length - 1];

      const priceFluctuation = (Math.random() - 0.48) * 15;
      const newPrice = Math.max(state.price + priceFluctuation, 100);
      state.trendUp = newPrice >= state.price;
      state.price = newPrice;

      // Update current or shift to next candle
      if (candles.length >= 15) {
        candles.shift();
      }

      const open = lastCandle ? lastCandle.close : state.price;
      const close = newPrice;
      const high = Math.max(open, close) + Math.random() * 8;
      const low = Math.min(open, close) - Math.random() * 8;

      candles.push({
        open,
        close,
        high,
        low,
        vol: 5 + Math.random() * 10
      });
    }

    drawChartScreen(SCREEN.chart.canvas, state);
    SCREEN.chart.needsUpdate = true;
  }

  // 3. Tick Terminal Screen
  if (SCREEN.terminal && SCREEN.terminal.canvas && SCREEN.terminal._state) {
    const state = SCREEN.terminal._state;
    state.step++;

    // Scroll line every 10 frames
    if (state.step % 10 === 0) {
      state.lineOffset++;
    }

    // Blink cursor every 18 frames
    if (state.step % 18 === 0) {
      state.cursorBlink++;
    }

    drawTerminalScreen(SCREEN.terminal.canvas, state);
    SCREEN.terminal.needsUpdate = true;
  }
}

/**
 * Updates retro mini-game arcade animation (Pong / retro arcade)
 * @param {object} SCREEN Object containing screen textures
 */
function tickGame(SCREEN) {
  if (!SCREEN || !SCREEN.game || !SCREEN.game.canvas || !SCREEN.game._state) return;

  const canvas = SCREEN.game.canvas;
  const state = SCREEN.game._state;
  const w = canvas.width;
  const h = canvas.height;

  state.step++;

  // Update stars twinkle
  state.stars.forEach(s => {
    s.alpha += (Math.random() - 0.5) * 0.1;
    if (s.alpha < 0.2) s.alpha = 0.2;
    if (s.alpha > 1.0) s.alpha = 1.0;
  });

  // Move Ball
  const ball = state.ball;
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Bounce Top / Bottom walls (accounting for border and HUD)
  if (ball.y - ball.r <= 22) {
    ball.y = 22 + ball.r;
    ball.vy = -ball.vy;
  } else if (ball.y + ball.r >= h - 8) {
    ball.y = h - 8 - ball.r;
    ball.vy = -ball.vy;
  }

  // Smooth AI paddle tracking
  const p1 = state.p1;
  const p2 = state.p2;

  const targetY1 = ball.y - p1.h / 2;
  p1.y += (targetY1 - p1.y) * 0.12;
  p1.y = Math.max(24, Math.min(h - 8 - p1.h, p1.y));

  const targetY2 = ball.y - p2.h / 2;
  p2.y += (targetY2 - p2.y) * 0.14;
  p2.y = Math.max(24, Math.min(h - 8 - p2.h, p2.y));

  // Paddle 1 Collision
  if (ball.x - ball.r <= p1.x + p1.w && ball.x >= p1.x) {
    if (ball.y >= p1.y && ball.y <= p1.y + p1.h) {
      ball.x = p1.x + p1.w + ball.r;
      ball.vx = Math.abs(ball.vx);
    }
  }

  // Paddle 2 Collision
  if (ball.x + ball.r >= p2.x && ball.x <= p2.x + p2.w) {
    if (ball.y >= p2.y && ball.y <= p2.y + p2.h) {
      ball.x = p2.x - ball.r;
      ball.vx = -Math.abs(ball.vx);
    }
  }

  // Goal reset
  if (ball.x < 6) {
    state.score2++;
    ball.x = w / 2;
    ball.y = h / 2;
    ball.vx = 3.0;
  } else if (ball.x > w - 6) {
    state.score1++;
    ball.x = w / 2;
    ball.y = h / 2;
    ball.vx = -3.0;
  }

  drawGameScreen(canvas, state);
  SCREEN.game.needsUpdate = true;
}

/**
 * Updates beating ECG heart monitor line
 * @param {object} SCREEN Object containing screen textures
 */
function tickEcg(SCREEN) {
  if (!SCREEN || !SCREEN.ecg || !SCREEN.ecg.canvas || !SCREEN.ecg._state) return;

  const canvas = SCREEN.ecg.canvas;
  const state = SCREEN.ecg._state;
  const w = canvas.width;
  const h = canvas.height;
  const centerY = h / 2 + 10;

  state.step++;
  state.phase = (state.phase + 1) % 40; // 40-step heartbeat cycle

  // Synthesize realistic P-Q-R-S-T wave offset
  let waveY = 0;
  const p = state.phase;

  if (p >= 5 && p < 10) {
    // P wave (atrial depolarization)
    waveY = -Math.sin(((p - 5) / 5) * Math.PI) * 9;
  } else if (p === 12) {
    // Q wave (septal deflection)
    waveY = 7;
  } else if (p === 14) {
    // R spike (ventricular depolarization)
    waveY = -62;
  } else if (p === 16) {
    // S wave
    waveY = 18;
  } else if (p >= 20 && p < 28) {
    // T wave (ventricular repolarization)
    waveY = -Math.sin(((p - 20) / 8) * Math.PI) * 16;
  }

  // Add subtle baseline jitter
  waveY += (Math.random() - 0.5) * 1.5;

  // Advance sweep coordinate
  const currentSampleY = centerY + waveY;
  state.history[state.sweepX] = currentSampleY;

  // Clear ahead of the sweep beam for authentic CRT phosphor sweep effect
  for (let k = 1; k <= 10; k++) {
    const clearIdx = (state.sweepX + k) % state.history.length;
    state.history[clearIdx] = centerY;
  }

  state.sweepX = (state.sweepX + 2) % w;

  drawEcgScreen(canvas, state);
  SCREEN.ecg.needsUpdate = true;
}

    { id: 'door_lobby', label: 'Pintu Lobby', x: 10, y: 0, z: 2, width: 2.2, height: 2.8, rotation: 0 },

  const outdoor = {
    key: 'outdoor',
    label: 'Task Garden (Area Outdoor)',
    x: 0,
    y: 0,
    z: 16,
    width: 38,
    depth: 12,
    walkway: { x: 0, z: 15, width: 3.6, depth: 10 },
    billboard: { x: -8.0, y: 1.8, z: 14.5, width: 6.8, height: 2.8 },
  };

  // Navigational & collision bounds for A* grid
  const bounds = {
    minX: -22,
    maxX: 22,
    minZ: -16,
    maxZ: 24,
    minY: 0,
    maxY: 10,
    cell: 0.5,

  return {

    entrance,
    rooms,
    doors,
    outdoor,

}

// =============================================================================
// 2. HELPER UTILITIES
// =============================================================================

function ensureOffice(office) {
  if (!office) office = {};
  if (!office.spots) office.spots = [];
  if (!office.rooms) office.rooms = {};
  if (!office.wallMeshes) office.wallMeshes = [];
  if (!office.glassMeshes) office.glassMeshes = [];
  if (!office.obstacleBoxes) office.obstacleBoxes = [];
  if (!office.animatedScreens) office.animatedScreens = [];
  if (!office.animatedLeds) office.animatedLeds = [];
  if (office.solidWalls === undefined) office.solidWalls = false;
  return office;
}

function registerObstacle(office, minX, maxX, minZ, maxZ, label = 'obstacle') {
  if (!office) return;
  const box = { minX, maxX, minZ, maxZ, label };
  office.obstacleBoxes.push(box);
  if (office.grid && typeof office.grid.block === 'function') {
    office.grid.block(minX, minZ, maxX, maxZ);
  }
}

function registerSpot(office, spot) {
  if (!office || !spot) return;
  office.spots.push({
    id: spot.id || `spot_${office.spots.length}`,
    name: spot.name || 'Work Spot',
    type: spot.type || 'desk',
    role: spot.role || 'any',
    x: spot.x || 0,
    y: spot.y || 0,
    z: spot.z || 0,
    yaw: spot.yaw || 0,
    activity: spot.activity || 'working',
    room: spot.room || '',
  });
}

function getMaterial(materials, key, fallbackColor, THREE, opts = {}) {
  if (materials && materials[key]) return materials[key];
  if (!THREE || !THREE.MeshStandardMaterial) {
    return { color: fallbackColor, ...opts };
  }
  return new THREE.MeshStandardMaterial({
    color: fallbackColor,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.6,
    metalness: opts.metalness !== undefined ? opts.metalness : 0.1,
    transparent: opts.transparent || false,
    opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
    ...opts,
  });
}

function createBox(THREE, w, h, d, mat, castShadow = true, receiveShadow = true) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = !!castShadow;
  mesh.receiveShadow = !!receiveShadow;
  return mesh;
}

function createCylinder(THREE, rt, rb, h, seg, mat, castShadow = true, receiveShadow = true) {
  const geo = new THREE.CylinderGeometry(rt, rb, h, seg);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = !!castShadow;
  mesh.receiveShadow = !!receiveShadow;
  return mesh;
}

// ARCHITECTURAL GLASS PARTITION & TRANSOM HELPERS

/**
 * Builds high-end European architectural glass partitions with black aluminum mullions,
 * top/bottom channels, and frosted manifestation film band.
 */
function createGlassPartition(width, height, depth, x, y, z, office, THREE, materials = {}, name = 'glass_partition') {
  office = ensureOffice(office);
  const pGroup = new THREE.Group();
  pGroup.name = name;

  const partitionGlassMat = materials.partitionGlass || new THREE.MeshStandardMaterial({
    color: 0xbae6fd,
    transparent: true,
    opacity: 0.28,
    roughness: 0.05,
    metalness: 0.2,
  });
  const partitionFrameMat = materials.partFrame || getMaterial(materials, 'partFrame', 0x334155, THREE, { metalness: 0.8, roughness: 0.2 });
  const frostedBandMat = materials.frostedBand || new THREE.MeshStandardMaterial({
    color: 0xe0f2fe,
    transparent: true,
    opacity: 0.52,
    roughness: 0.35,
    metalness: 0.1,
  });

  const isAlongZ = depth > width;
  const length = isAlongZ ? depth : width;
  const paneThick = 0.08;
  const frameThick = 0.18;
  const frameH = 0.12;
  const glassH = height - (frameH * 2);

  // 1. Base floor channel (anodized aluminum)
  const baseW = isAlongZ ? frameThick : length;
  const baseD = isAlongZ ? length : frameThick;
  const baseFrame = createBox(THREE, baseW, frameH, baseD, partitionFrameMat);
  baseFrame.position.set(0, -height / 2 + frameH / 2, 0);
  pGroup.add(baseFrame);

  // 2. Top ceiling channel
  const topFrame = createBox(THREE, baseW, frameH, baseD, partitionFrameMat);
  topFrame.position.set(0, height / 2 - frameH / 2, 0);
  pGroup.add(topFrame);

  // 3. Main tempered glass pane
  const glassW = isAlongZ ? paneThick : length;
  const glassD = isAlongZ ? length : paneThick;
  const pane = createBox(THREE, glassW, glassH, glassD, partitionGlassMat);
  pane.position.set(0, 0, 0);
  pGroup.add(pane);
  office.glassMeshes.push(pane);

  // 4. Decorative frosted manifestation film band (waist/chest level: Y ~ 1.4m from floor)
  const bandH = 0.38;
  const bandW = isAlongZ ? paneThick + 0.01 : length;
  const bandD = isAlongZ ? length : paneThick + 0.01;
  const bandY = -height / 2 + 1.4;
  const band = createBox(THREE, bandW, bandH, bandD, frostedBandMat);
  band.position.set(0, bandY, 0);
  pGroup.add(band);
  office.glassMeshes.push(band);

  // 5. Vertical aluminum mullions / posts spaced evenly every ~2.2 meters
  const numPanels = Math.max(1, Math.round(length / 2.2));
  const step = length / numPanels;
  const mullionW = isAlongZ ? frameThick : 0.08;
  const mullionD = isAlongZ ? 0.08 : frameThick;

  for (let i = 0; i <= numPanels; i++) {
    const offset = -length / 2 + i * step;
    const mullion = createBox(THREE, mullionW, glassH, mullionD, partitionFrameMat);
    if (isAlongZ) {
      mullion.position.set(0, 0, offset);
    } else {
      mullion.position.set(offset, 0, 0);
    }
    pGroup.add(mullion);
  }

  pGroup.position.set(x, y, z);
  return pGroup;
}

/**
 * Helper for glass transom headers above doorways with aluminum lintel and jamb posts.
 */
function createDoorTransom(width, height, depth, x, z, office, THREE, materials = {}, doorClearanceH = 2.6) {
  office = ensureOffice(office);
  const tGroup = new THREE.Group();
  const partitionGlassMat = materials.partitionGlass || new THREE.MeshStandardMaterial({
    color: 0xbae6fd,
    transparent: true,
    opacity: 0.28,
    roughness: 0.05,
    metalness: 0.2,
  });
  const partitionFrameMat = materials.partFrame || getMaterial(materials, 'partFrame', 0x334155, THREE, { metalness: 0.8, roughness: 0.2 });

  const isAlongZ = depth > width;
  const length = isAlongZ ? depth : width;
  const transomH = height - doorClearanceH;
  const frameThick = 0.18;
  const paneThick = 0.08;
  const frameH = 0.10;

  // Header lintel frame above doorway
  const lintelW = isAlongZ ? frameThick : length;
  const lintelD = isAlongZ ? length : frameThick;
  const lintel = createBox(THREE, lintelW, frameH, lintelD, partitionFrameMat);
  lintel.position.set(0, doorClearanceH + frameH / 2, 0);
  tGroup.add(lintel);

  // Top ceiling frame
  const topF = createBox(THREE, lintelW, frameH, lintelD, partitionFrameMat);
  topF.position.set(0, height - frameH / 2, 0);
  tGroup.add(topF);

  // Glass transom pane
  const glassW = isAlongZ ? paneThick : length - 0.04;
  const glassD = isAlongZ ? length - 0.04 : paneThick;
  const glassPaneH = transomH - (frameH * 2);
  const pane = createBox(THREE, glassW, glassPaneH, glassD, partitionGlassMat);
  pane.position.set(0, doorClearanceH + frameH + glassPaneH / 2, 0);
  tGroup.add(pane);
  office.glassMeshes.push(pane);

  // Left and right vertical door jamb posts
  const postW = isAlongZ ? frameThick : 0.08;
  const postD = isAlongZ ? 0.08 : frameThick;
  [-length / 2 + 0.04, length / 2 - 0.04].forEach(offset => {
    const post = createBox(THREE, postW, doorClearanceH, postD, partitionFrameMat);
    if (isAlongZ) {
      post.position.set(0, doorClearanceH / 2, offset);
    } else {
      post.position.set(offset, doorClearanceH / 2, 0);
    }
    tGroup.add(post);
  });

  tGroup.position.set(x, 0, z);
  return tGroup;
}

/**
 * Builds outer walls, parquet/hall floor base, glass facade windows, front wooden doors with canopy,
 * and registers A* obstacle bounds.
 */
function buildShell(world, L, office, THREE, materials = {}) {
  office = ensureOffice(office);
  const shellGroup = new THREE.Group();
  shellGroup.name = 'building_shell';

  const b = L.building;
  const H = b.height;
  const wallThick = 0.4;

  // Materials
  const floorMat = getMaterial(materials, 'floor', 0x242d3d, THREE, { roughness: 0.8 });
  const hallFloorMat = getMaterial(materials, 'hallFloor', 0x1f2633, THREE, { roughness: 0.7 });
  const wallSolidMat = getMaterial(materials, 'wallSolid', 0x171d28, THREE, { roughness: 0.9 });
  const glassMat = getMaterial(materials, 'glass', 0x93c5fd, THREE, {
    transparent: true,
    opacity: office.solidWalls ? 0.95 : 0.25,
    roughness: 0.1,
    metalness: 0.2,
  });
  const frameMat = getMaterial(materials, 'windowFrame', 0x0f172a, THREE, { metalness: 0.8 });
  const woodDoorMat = getMaterial(materials, 'woodDoor', 0x78350f, THREE, { roughness: 0.5 });
  const canopyMat = getMaterial(materials, 'canopy', 0x334155, THREE, { metalness: 0.6, roughness: 0.3 });

  // 1. Base Building Floor
  const baseFloor = createBox(THREE, b.width, 0.2, b.depth, floorMat, false, true);
  baseFloor.position.set(b.x, -0.1, b.z);
  shellGroup.add(baseFloor);

  // 2. Central Hallway Floor Accent
  const hallFloor = createBox(THREE, L.hall.width, 0.22, L.hall.depth, hallFloorMat, false, true);
  hallFloor.position.set(L.hall.x, -0.09, L.hall.z);
  shellGroup.add(hallFloor);

  // Entrance Foyer Floor leading to front doors
  const foyerFloor = createBox(THREE, L.entrance.width, 0.22, L.entrance.depth, hallFloorMat, false, true);
  foyerFloor.position.set(L.entrance.x, -0.09, L.entrance.z);
  shellGroup.add(foyerFloor);

  // 3. Outer Walls
  // Back Wall (North: Z = -14, spanning X: -18 to 18)
  const backWall = createBox(THREE, b.width, H, wallThick, wallSolidMat);
  backWall.position.set(b.x, H / 2, -14);
  shellGroup.add(backWall);
  office.wallMeshes.push(backWall);
  registerObstacle(office, -18, 18, -14.2, -13.8, 'back_wall');

  // Left Outer Wall (West: X = -18, spanning Z: -14 to 10)
  const leftWall = createBox(THREE, wallThick, H, b.depth, wallSolidMat);
  leftWall.position.set(-18, H / 2, b.z);
  shellGroup.add(leftWall);
  office.wallMeshes.push(leftWall);
  registerObstacle(office, -18.2, -17.8, -14, 10, 'left_wall');

  // Right Outer Wall (East: X = 18, spanning Z: -14 to 10)
  const rightWall = createBox(THREE, wallThick, H, b.depth, wallSolidMat);
  rightWall.position.set(18, H / 2, b.z);
  shellGroup.add(rightWall);
  office.wallMeshes.push(rightWall);
  registerObstacle(office, 17.8, 18.2, -14, 10, 'right_wall');

  // Front Outer Walls (South: Z = 10, flanking front entrance door at X = [-1.4, 1.4])
  // Left front segment: X: -18 to -2
  const frontLeftWall = createBox(THREE, 16, H, wallThick, wallSolidMat);
  frontLeftWall.position.set(-10, H / 2, 10);
  frontLeftWall.userData.isFacadeCutaway = true;
  shellGroup.add(frontLeftWall);
  office.wallMeshes.push(frontLeftWall);
  registerObstacle(office, -18, -2, 9.8, 10.2, 'front_left_wall');

  // Right front segment: X: 2 to 18
  const frontRightWall = createBox(THREE, 16, H, wallThick, wallSolidMat);
  frontRightWall.position.set(10, H / 2, 10);
  frontRightWall.userData.isFacadeCutaway = true;
  shellGroup.add(frontRightWall);
  office.wallMeshes.push(frontRightWall);
  registerObstacle(office, 2, 18, 9.8, 10.2, 'front_right_wall');

  // 4. Large Glass Facade Windows (inset on front walls)
  const glassWidth = 14;
  const glassHeight = 3.2;
  const glassLeft = createBox(THREE, glassWidth, glassHeight, 0.15, glassMat);
  glassLeft.position.set(-10, 2.1, 10.05);
  glassLeft.userData.isGlassFacade = true;
  shellGroup.add(glassLeft);
  office.glassMeshes.push(glassLeft);

  const glassRight = createBox(THREE, glassWidth, glassHeight, 0.15, glassMat);
  glassRight.position.set(10, 2.1, 10.05);
  glassRight.userData.isGlassFacade = true;
  shellGroup.add(glassRight);
  office.glassMeshes.push(glassRight);

  // Window Frames (Top & Bottom mullions)
  [-10, 10].forEach(gx => {
    const frameBottom = createBox(THREE, glassWidth, 0.1, 0.25, frameMat);
    frameBottom.position.set(gx, 0.5, 10.05);
    shellGroup.add(frameBottom);

    const frameTop = createBox(THREE, glassWidth, 0.1, 0.25, frameMat);
    frameTop.position.set(gx, 3.7, 10.05);
    shellGroup.add(frameTop);
  });

  // 5. Front Wooden Double Doors with Canopy at (0, 0, 10)
  const doorWidth = 2.4;
  const doorHeight = 3.2;
  const doorPanelW = doorWidth / 2;

  // Door Frame
  const frameH = createBox(THREE, doorWidth + 0.3, 0.2, 0.35, frameMat);
  frameH.position.set(0, doorHeight + 0.1, 10);
  shellGroup.add(frameH);

  // Left Door Leaf
  const doorL = createBox(THREE, doorPanelW - 0.05, doorHeight, 0.12, woodDoorMat);
  doorL.position.set(-doorPanelW / 2, doorHeight / 2, 10);
  shellGroup.add(doorL);

  // Right Door Leaf
  const doorR = createBox(THREE, doorPanelW - 0.05, doorHeight, 0.12, woodDoorMat);
  doorR.position.set(doorPanelW / 2, doorHeight / 2, 10);
  shellGroup.add(doorR);

  // Door handles (metallic gold)
  const handleMat = getMaterial(materials, 'doorHandle', 0xf59e0b, THREE, { metalness: 0.9, roughness: 0.2 });
  const handleL = createCylinder(THREE, 0.03, 0.03, 0.4, 8, handleMat);
  handleL.position.set(-0.15, 1.4, 10.1);
  shellGroup.add(handleL);

  const handleR = createCylinder(THREE, 0.03, 0.03, 0.4, 8, handleMat);
  handleR.position.set(0.15, 1.4, 10.1);
  shellGroup.add(handleR);

  // Canopy Roof Overhang at Entrance
  const canopy = createBox(THREE, 4.2, 0.25, 2.8, canopyMat);
  canopy.position.set(0, 3.6, 11.2);
  shellGroup.add(canopy);

  // Canopy support posts
  const postL = createCylinder(THREE, 0.06, 0.06, 3.6, 12, frameMat);
  postL.position.set(-1.9, 1.8, 12.4);
  shellGroup.add(postL);
  const postR = createCylinder(THREE, 0.06, 0.06, 3.6, 12, frameMat);
  postR.position.set(1.9, 1.8, 12.4);
  shellGroup.add(postR);

  // 6. Internal Partition Walls (Open-Space Glass Partitions with Aluminum Mullions)
  // Rear partition wall along Z = -2 (separating rear rooms from hallway)
  // Left dividing wall (between Server Room and Dev & Ops): X: -10, Z: -14 to -2
  const glassServerDev = createGlassPartition(0.1, H, 12, -10, H / 2, -8, office, THREE, materials, 'glass_server_dev');
  shellGroup.add(glassServerDev);
  registerObstacle(office, -10.2, -9.8, -14, -2, 'wall_server_dev');

  // Right dividing wall (between Dev and CEO): X: 6, Z: -14 to -2
  const glassDevCeo = createGlassPartition(0.1, H, 12, 6, H / 2, -8, office, THREE, materials, 'glass_dev_ceo');
  shellGroup.add(glassDevCeo);
  registerObstacle(office, 5.8, 6.2, -14, -2, 'wall_dev_ceo');

  // Partition along Z = -2 with door openings & transoms
  // Server wall: X: -18 to -15.1 and -12.9 to -10 (opening at -14)
  const partServerL = createGlassPartition(2.9, H, 0.1, -16.55, H / 2, -2, office, THREE, materials, 'part_server_l');
  shellGroup.add(partServerL);
  registerObstacle(office, -18, -15.1, -2.2, -1.8, 'part_server_l');

  const partServerR = createGlassPartition(2.9, H, 0.1, -11.45, H / 2, -2, office, THREE, materials, 'part_server_r');
  shellGroup.add(partServerR);
  registerObstacle(office, -12.9, -10, -2.2, -1.8, 'part_server_r');

  // Server door transom header
  const transomServer = createDoorTransom(2.2, H, 0.1, -14, -2, office, THREE, materials);
  shellGroup.add(transomServer);

  // Dev wall: X: -10 to -3.2 and -0.8 to 6 (opening at -2)
  const partDevL = createGlassPartition(6.8, H, 0.1, -6.6, H / 2, -2, office, THREE, materials, 'part_dev_l');
  shellGroup.add(partDevL);
  registerObstacle(office, -10, -3.2, -2.2, -1.8, 'part_dev_l');

  const partDevR = createGlassPartition(6.8, H, 0.1, 2.6, H / 2, -2, office, THREE, materials, 'part_dev_r');
  shellGroup.add(partDevR);
  registerObstacle(office, -0.8, 6, -2.2, -1.8, 'part_dev_r');

  // Dev door transom header
  const transomDev = createDoorTransom(2.4, H, 0.1, -2, -2, office, THREE, materials);
  shellGroup.add(transomDev);

  // CEO wall: X: 6 to 10.5 and 13.5 to 18 (opening at 12)
  const partCeoL = createGlassPartition(4.5, H, 0.1, 8.25, H / 2, -2, office, THREE, materials, 'part_ceo_l');
  shellGroup.add(partCeoL);
  registerObstacle(office, 6, 10.5, -2.2, -1.8, 'part_ceo_l');

  const partCeoR = createGlassPartition(4.5, H, 0.1, 15.75, H / 2, -2, office, THREE, materials, 'part_ceo_r');
  shellGroup.add(partCeoR);
  registerObstacle(office, 13.5, 18, -2.2, -1.8, 'part_ceo_r');

  // CEO door transom header
  const transomCeo = createDoorTransom(3.0, H, 0.1, 12, -2, office, THREE, materials);
  shellGroup.add(transomCeo);

  // Front partition wall along Z = 2 (separating front rooms from hallway, with openings at X = -10, 10)
  // Creative partition at Z = 2: X: -18 to -11.5 and -8.5 to -2 (door at -10)
  const partCreaL = createGlassPartition(6.5, H, 0.1, -14.75, H / 2, 2, office, THREE, materials, 'part_crea_l');
  shellGroup.add(partCreaL);
  registerObstacle(office, -18, -11.5, 1.8, 2.2, 'part_crea_l');

  const partCreaR = createGlassPartition(6.5, H, 0.1, -5.25, H / 2, 2, office, THREE, materials, 'part_crea_r');
  shellGroup.add(partCreaR);
  registerObstacle(office, -8.5, -2, 1.8, 2.2, 'part_crea_r');

  // Creative door transom header
  const transomCrea = createDoorTransom(3.0, H, 0.1, -10, 2, office, THREE, materials);
  shellGroup.add(transomCrea);

  // Wall separating Creative from Entrance Foyer (X = -2, Z: 2 to 10)
  const partFoyerL = createGlassPartition(0.1, H, 8, -2, H / 2, 6, office, THREE, materials, 'part_foyer_l');
  shellGroup.add(partFoyerL);
  registerObstacle(office, -2.2, -1.8, 2, 10, 'part_foyer_l');

  // Lobby partition at Z = 2: X: 2 to 8.5 and 11.5 to 18 (door at 10)
  const partLobbyL = createGlassPartition(6.5, H, 0.1, 5.25, H / 2, 2, office, THREE, materials, 'part_lobby_l');
  shellGroup.add(partLobbyL);
  registerObstacle(office, 2, 8.5, 1.8, 2.2, 'part_lobby_l');

  const partLobbyR = createGlassPartition(6.5, H, 0.1, 14.75, H / 2, 2, office, THREE, materials, 'part_lobby_r');
  shellGroup.add(partLobbyR);
  registerObstacle(office, 11.5, 18, 1.8, 2.2, 'part_lobby_r');

  // Lobby door transom header
  const transomLobby = createDoorTransom(3.0, H, 0.1, 10, 2, office, THREE, materials);
  shellGroup.add(transomLobby);

  // Wall separating Lobby from Entrance Foyer (X = 2, Z: 2 to 10)
  const partFoyerR = createGlassPartition(0.1, H, 8, 2, H / 2, 6, office, THREE, materials, 'part_foyer_r');
  shellGroup.add(partFoyerR);
  registerObstacle(office, 1.8, 2.2, 2, 10, 'part_foyer_r');

  world.add(shellGroup);
  office.shell = shellGroup;

  // Apply default wall visibility state
  setWalls(office, office.solidWalls, THREE);

  return shellGroup;
}

/**
 * Builds office rooms:
 * - CEO Strategy Room: executive teak desk/chair, roadmap strategy screen, potted plant, blue carpet
 * - Dev & Ops Lab: dual workstations with dual animated code/test monitors, blinking server racks
 * - Research & Creative Studio: workstations, technical bookshelf, whiteboard
 */
function buildRoom(world, host, p, office, THREE, materials = {}) {
  office = ensureOffice(office);
  const roomGroup = new THREE.Group();
  roomGroup.name = `room_${p.key}`;

  const deskMat = getMaterial(materials, 'woodDesk', 0x451a03, THREE, { roughness: 0.4 });
  const modernDeskMat = getMaterial(materials, 'modernDesk', 0x1f2937, THREE, { roughness: 0.3 });
  const chairMat = getMaterial(materials, 'chair', 0x111827, THREE, { roughness: 0.6 });
  const screenBorderMat = getMaterial(materials, 'monitorBezel', 0x030712, THREE, { metalness: 0.8 });
  const plantPotMat = getMaterial(materials, 'plantPot', 0xe2e8f0, THREE, { roughness: 0.3 });
  const leafMat = getMaterial(materials, 'plantLeaf', 0x15803d, THREE, { roughness: 0.5 });
  const whiteMat = getMaterial(materials, 'whiteboard', 0xf8fafc, THREE, { roughness: 0.2 });

  // Custom carpet for the room
  const carpetMat = getMaterial(materials, `carpet_${p.key}`, p.carpetColor || 0x1e293b, THREE, { roughness: 0.9 });
  const carpet = createBox(THREE, p.width - 1.2, 0.05, p.depth - 1.2, carpetMat, false, true);
  carpet.position.set(p.x, 0.03, p.z);
  roomGroup.add(carpet);

  // ---------------------------------------------------------------------------
  // A. CEO STRATEGY ROOM
  // ---------------------------------------------------------------------------
  if (p.key === 'ceo') {
    // 1. Executive L-shaped Teak Desk at (p.x = 12, z = -9.5)
    const mainDesk = createBox(THREE, 3.4, 0.75, 1.4, deskMat);
    mainDesk.position.set(p.x, 0.375, -9.5);
    roomGroup.add(mainDesk);

    const sideDesk = createBox(THREE, 1.2, 0.72, 1.6, deskMat);
    sideDesk.position.set(p.x + 1.8, 0.36, -9.0);
    roomGroup.add(sideDesk);
    registerObstacle(office, p.x - 1.8, p.x + 2.5, -10.3, -8.1, 'ceo_desk_obs');

    roomGroup.add(chairSeat);
    const chairBack = createBox(THREE, 0.8, 0.9, 0.15, chairMat);
    chairBack.position.set(p.x, 0.95, -11.2);
    roomGroup.add(chairBack);

    // Executive Roadmap Screen (Strategy Board) on North Wall (Z = -13.8)

    const roadmapScreenMat = materials.screenChart || getMaterial(materials, 'screenChart', 0x1e3a8a, THREE, {

    const roadmapScreen = createBox(THREE, 4.0, 2.0, 0.05, roadmapScreenMat);
    roadmapScreen.position.set(p.x, 2.4, -13.75);
    roomGroup.add(roadmapScreen);
    office.animatedScreens.push({ type: 'chart', mesh: roadmapScreen });

    // Laptop on CEO desk
    const ceoLaptop = createBox(THREE, 0.5, 0.03, 0.4, screenBorderMat);
    ceoLaptop.position.set(p.x - 0.2, 0.77, -9.5);
    roomGroup.add(ceoLaptop);

    // Potted Ceramic Plant
    const pot = createCylinder(THREE, 0.35, 0.25, 0.7, 16, plantPotMat);
    pot.position.set(p.x - 3.8, 0.35, -12);
    roomGroup.add(pot);
    const plantBush = createCylinder(THREE, 0.65, 0.4, 0.9, 12, leafMat);
    plantBush.position.set(p.x - 3.8, 1.0, -12);
    roomGroup.add(plantBush);
    registerObstacle(office, p.x - 4.3, p.x - 3.3, -12.5, -11.5, 'ceo_plant');

    // 2 Guest Chairs in front of desk
    [-0.9, 0.9].forEach(gx => {
      const gSeat = createBox(THREE, 0.6, 0.08, 0.6, chairMat);
      gSeat.position.set(p.x + gx, 0.45, -8.0);
      roomGroup.add(gSeat);
      const gBack = createBox(THREE, 0.6, 0.6, 0.1, chairMat);
      gBack.position.set(p.x + gx, 0.75, -7.7);
      roomGroup.add(gBack);
    });

    // Credenza / Storage along East wall
    const credenza = createBox(THREE, 0.7, 1.0, 3.5, deskMat);
    credenza.position.set(17.4, 0.5, -9.5);
    roomGroup.add(credenza);
    registerObstacle(office, 17.0, 17.8, -11.5, -7.5, 'ceo_credenza');

    // Executive Tinted Glass Divider with Sleek Mullions at x = 7.5
    const ceoGlass = createGlassPartition(0.1, 3.2, 4.5, 7.5, 1.6, -10.75, office, THREE, materials, 'ceo_glass_divider');
    roomGroup.add(ceoGlass);
    registerObstacle(office, 7.3, 7.7, -13.0, -8.5, 'ceo_glass_divider');

    // Interactive spots
    registerSpot(office, {
      id: 'ceo_desk',
      name: 'CEO Executive Desk',
      type: 'desk',
      role: 'kamala',
      x: p.x,
      y: 0,
      z: -10.8,
      yaw: 0,
      activity: 'typing',
      room: 'ceo',
    });

    registerSpot(office, {
      id: 'ceo_roadmap',
      name: 'CEO Strategy Board Review',
      type: 'desk',
      role: 'kamala',
      x: p.x,
      y: 0,
      z: -12.5,
      yaw: 0,
      activity: 'planning',
      room: 'ceo',
    });
  }

  // ---------------------------------------------------------------------------
  // B. DEV & OPS LAB (EXPANDED OPEN SPACE)
  // ---------------------------------------------------------------------------
  else if (p.key === 'devops') {
    // 1. Workstations for Builder (Devin), Reviewer (Audit), and Subagent Workers (Alpha, Beta, Gamma, Delta)
    const deskConfig = [
      { id: 'builder', role: 'devin', label: 'Builder Workstation', x: -2.5, z: -7.0 },
      { id: 'reviewer', role: 'audit', label: 'Reviewer Workstation', x: 2.5, z: -7.0 },
      { id: 'subagent_1', role: 'subagent_1', label: 'Subagent Station Alpha', x: -2.5, z: -10.0 },
      { id: 'subagent_2', role: 'subagent_2', label: 'Subagent Station Beta', x: 2.5, z: -10.0 },
      { id: 'subagent_3', role: 'subagent_3', label: 'Subagent Station Gamma', x: -6.5, z: -10.0 },
      { id: 'subagent_4', role: 'subagent_4', label: 'Subagent Station Delta', x: -6.5, z: -7.0 },
    ];

    deskConfig.forEach(cfg => {
      // Workstation desk
      const desk = createBox(THREE, 2.6, 0.75, 1.2, modernDeskMat);
      desk.position.set(cfg.x, 0.375, cfg.z);
      roomGroup.add(desk);
      registerObstacle(office, cfg.x - 1.35, cfg.x + 1.35, cfg.z - 0.6, cfg.z + 0.45, `desk_${cfg.id}`);

      // Ergonomic Chair
      const seat = createBox(THREE, 0.65, 0.08, 0.65, chairMat);
      seat.position.set(cfg.x, 0.48, cfg.z + 0.95);
      roomGroup.add(seat);
      const back = createBox(THREE, 0.65, 0.7, 0.1, chairMat);
      back.position.set(cfg.x, 0.85, cfg.z + 1.25);
      roomGroup.add(back);

      // Dual Monitors on desk
      [-0.55, 0.55].forEach((mx, idx) => {
        // Monitor stand
        const stand = createCylinder(THREE, 0.04, 0.04, 0.25, 8, screenBorderMat);
        stand.position.set(cfg.x + mx, 0.88, cfg.z - 0.2);
        roomGroup.add(stand);

        // Bezel
        const bezel = createBox(THREE, 0.85, 0.55, 0.05, screenBorderMat);
        bezel.position.set(cfg.x + mx, 1.15, cfg.z - 0.2);
        bezel.rotation.y = mx > 0 ? -0.15 : 0.15;
        roomGroup.add(bezel);

        // Screen display: Left monitor = Procedural Code IDE, Right monitor = Procedural Terminal CLI
        const screenTex = idx === 0
          ? (materials.SCREEN?.code || materials.codeTex)
          : (materials.SCREEN?.terminal || materials.SCREEN?.code || materials.codeTex);

        let devScreenMat;
        if (screenTex) {
          devScreenMat = new THREE.MeshStandardMaterial({
            map: screenTex,
            emissive: 0xffffff,
            emissiveMap: screenTex,
            emissiveIntensity: 0.85,
            roughness: 0.2,
            metalness: 0.1
          });
        } else {
          devScreenMat = getMaterial(materials, idx === 0 ? 'screenCode' : 'screenTerm', idx === 0 ? 0x10b981 : 0x0284c7, THREE, {
            emissive: idx === 0 ? 0x10b981 : 0x0284c7,
            emissiveIntensity: 0.6
          });
        }

        const screen = createBox(THREE, 0.8, 0.5, 0.02, devScreenMat);
        screen.position.set(cfg.x + mx, 1.15, cfg.z - 0.17);
        screen.rotation.y = mx > 0 ? -0.15 : 0.15;
        roomGroup.add(screen);
        office.animatedScreens.push({ type: idx === 0 ? 'code' : 'terminal', mesh: screen, agent: cfg.role });
      });

      // Keyboard & Mouse
      const kb = createBox(THREE, 0.55, 0.02, 0.2, screenBorderMat);
      kb.position.set(cfg.x, 0.76, cfg.z + 0.15);
      roomGroup.add(kb);

      // Frosted acoustic glass desk screen
      const screenH = 0.42;
      const deskGlassMat = materials.frostedBand || new THREE.MeshStandardMaterial({
        color: 0xe0f2fe,
        transparent: true,
        opacity: 0.52,
        roughness: 0.35,
        metalness: 0.1,
      });
      const deskGlass = createBox(THREE, 2.3, screenH, 0.03, deskGlassMat);
      deskGlass.position.set(cfg.x, 0.75 + screenH / 2, cfg.z - 0.52);
      roomGroup.add(deskGlass);
      office.glassMeshes.push(deskGlass);

      const partFrameMat = materials.partFrame || getMaterial(materials, 'partFrame', 0x334155, THREE, { metalness: 0.8, roughness: 0.2 });
      [-0.8, 0.8].forEach(bx => {
        const bracket = createBox(THREE, 0.06, 0.12, 0.06, partFrameMat);
        bracket.position.set(cfg.x + bx, 0.78, cfg.z - 0.52);
        roomGroup.add(bracket);
      });

      // Register interactive desk spot
      registerSpot(office, {
        id: `dev_${cfg.id}_desk`,
        name: cfg.label,
        type: 'desk',
        role: cfg.role,
        x: cfg.x,
        y: 0,
        z: cfg.z + 0.95,
        yaw: Math.PI,
        activity: cfg.id === 'builder' ? 'coding' : 'review',
        room: 'devops',
      });
    });

    // Subagent Staging Bay Glass Divider
    const devBayGlass = createGlassPartition(0.1, 2.6, 3.2, -4.5, 1.3, -11.0, office, THREE, materials, 'dev_bay_glass');
    roomGroup.add(devBayGlass);
    registerObstacle(office, -4.7, -4.3, -12.6, -9.4, 'dev_bay_glass');

    // 2. High-Tech Staging Server Rack along North wall (Z = -13.0)
    [4.2].forEach((rx, idx) => {
      const rack = createBox(THREE, 1.4, 3.2, 0.8, screenBorderMat);
      rack.position.set(rx, 1.6, -13.0);
      roomGroup.add(rack);
      registerObstacle(office, rx - 0.8, rx + 0.8, -13.5, -12.5, `server_staging_rack`);

      // Server rack units & blinking LEDs
      for (let s = 0; s < 5; s++) {
        const unitY = 0.6 + s * 0.55;
        const serverUnit = createBox(THREE, 1.25, 0.45, 0.05, modernDeskMat);
        serverUnit.position.set(rx, unitY, -12.58);
        roomGroup.add(serverUnit);

        // Blinking status LEDs (green/amber)
        [-0.4, -0.2, 0.0, 0.2, 0.4].forEach((lx, lidx) => {
          const isGreen = (s + lidx) % 2 === 0;
          const ledMat = getMaterial(materials, isGreen ? 'ledGreen' : 'ledAmber', isGreen ? 0x22c55e : 0xf59e0b, THREE, {
            emissive: isGreen ? 0x22c55e : 0xf59e0b,
            emissiveIntensity: 0.8,
          });
          const led = createBox(THREE, 0.05, 0.05, 0.03, ledMat);
          led.position.set(rx + lx, unitY, -12.54);
          roomGroup.add(led);
          office.animatedLeds.push({ mesh: led, rate: 2 + ((s + lidx) % 3) });
        });
      }
    });

    // Central architecture whiteboard on North wall (centered in widened Dev Lab at x: -2)
    const wbMatDev = whiteMat.clone();
    const wb = createBox(THREE, 3.4, 1.8, 0.06, wbMatDev);
    wb.position.set(-2, 2.2, -13.85);
    roomGroup.add(wb);
    office.whiteboardDevops = wb;

    // Interactive spot for Dev Sprint Whiteboard
    registerSpot(office, {
      id: 'dev_sprint_board',
      name: 'Architecture Whiteboard Review',
      type: 'whiteboard',
      role: 'any',
      x: -2,
      y: 0,
      z: -12.2,
      yaw: 0,
      activity: 'review',
      room: 'devops',
    });
  }

  // ---------------------------------------------------------------------------
  // C. RESEARCH & CREATIVE STUDIO
  // ---------------------------------------------------------------------------
  else if (p.key === 'creative') {
    // 1. Dual Workstations for Researcher (Rani) and Content Writer (Aura)
    const studioDesks = [
      { id: 'research', role: 'rani', label: 'Researcher Workstation', x: p.x - 3.0, z: p.z + 1.2 },
      { id: 'content', role: 'aura', label: 'Content Workstation', x: p.x + 3.0, z: p.z + 1.2 },
    ];

    studioDesks.forEach(cfg => {
      const desk = createBox(THREE, 2.6, 0.75, 1.2, modernDeskMat);
      desk.position.set(cfg.x, 0.375, cfg.z);
      roomGroup.add(desk);
      registerObstacle(office, cfg.x - 1.4, cfg.x + 1.4, cfg.z - 0.7, cfg.z + 0.7, `desk_${cfg.id}`);

      // Chair
      const seat = createBox(THREE, 0.65, 0.08, 0.65, chairMat);
      seat.position.set(cfg.x, 0.48, cfg.z - 0.95);
      roomGroup.add(seat);
      const back = createBox(THREE, 0.65, 0.7, 0.1, chairMat);
      back.position.set(cfg.x, 0.85, cfg.z - 1.25);
      roomGroup.add(back);

      // Curved Ultrawide Monitor
      const stand = createCylinder(THREE, 0.04, 0.04, 0.25, 8, screenBorderMat);
      stand.position.set(cfg.x, 0.88, cfg.z + 0.3);
      roomGroup.add(stand);

      const ultrawide = createBox(THREE, 1.4, 0.55, 0.05, screenBorderMat);
      ultrawide.position.set(cfg.x, 1.15, cfg.z + 0.3);
      roomGroup.add(ultrawide);

      const screenMat = materials.screenChart || getMaterial(materials, 'screenChart', 0x38bdf8, THREE, {
        emissive: 0x0284c7,
        emissiveIntensity: 0.5,
      });
      const screen = createBox(THREE, 1.35, 0.5, 0.02, screenMat);
      screen.position.set(cfg.x, 1.15, cfg.z + 0.27);
      roomGroup.add(screen);
      office.animatedScreens.push({ type: 'chart', mesh: screen, agent: cfg.role });

      // Frosted acoustic glass desk screen
      const screenH = 0.42;
      const deskGlassMat = materials.frostedBand || new THREE.MeshStandardMaterial({
        color: 0xe0f2fe,
        transparent: true,
        opacity: 0.52,
        roughness: 0.35,
        metalness: 0.1,
      });
      const deskGlass = createBox(THREE, 2.3, screenH, 0.03, deskGlassMat);
      deskGlass.position.set(cfg.x, 0.75 + screenH / 2, cfg.z + 0.52);
      roomGroup.add(deskGlass);
      office.glassMeshes.push(deskGlass);

      const partFrameMat = materials.partFrame || getMaterial(materials, 'partFrame', 0x334155, THREE, { metalness: 0.8, roughness: 0.2 });
      [-0.8, 0.8].forEach(bx => {
        const bracket = createBox(THREE, 0.06, 0.12, 0.06, partFrameMat);
        bracket.position.set(cfg.x + bx, 0.78, cfg.z + 0.52);
        roomGroup.add(bracket);
      });

      // Spot
      registerSpot(office, {
        id: `${cfg.id}_desk`,
        name: cfg.label,
        type: 'desk',
        role: cfg.role,
        x: cfg.x,
        y: 0,
        z: cfg.z - 0.95,
        yaw: 0,
        activity: cfg.id === 'research' ? 'researching' : 'writing',
        room: 'creative',
      });
    });

    // Creative Studio Architectural Glass Divider at x = -6.0
    const creaGlass = createGlassPartition(0.1, 2.6, 3.5, -6.0, 1.3, 5.75, office, THREE, materials, 'crea_glass_divider');
    roomGroup.add(creaGlass);
    registerObstacle(office, -6.2, -5.8, 4.0, 7.5, 'crea_glass_divider');

    // 2. Large Technical Bookshelf along West wall (X = -17.5)
    const shelf = createBox(THREE, 0.6, 3.2, 4.0, deskMat);
    shelf.position.set(-17.4, 1.6, p.z);
    roomGroup.add(shelf);
    registerObstacle(office, -17.8, -17.0, p.z - 2.1, p.z + 2.1, 'creative_bookshelf');

    // Colorful procedural book rows on shelves
    const bookColors = [0xef4444, 0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899];
    for (let r = 0; r < 4; r++) {
      const shelfY = 0.5 + r * 0.75;
      for (let b = 0; b < 10; b++) {
        const bookMat = getMaterial(materials, `book_${r}_${b}`, bookColors[(r * 3 + b) % bookColors.length], THREE);
        const book = createBox(THREE, 0.4, 0.45, 0.12, bookMat);
        book.position.set(-17.3, shelfY + 0.22, p.z - 1.6 + b * 0.35);
        roomGroup.add(book);
      }
    }

    // 3. Brainstorming Whiteboard with sticky notes along South/Front side
    const wbMatCreative = whiteMat.clone();
    const wb = createBox(THREE, 4.5, 2.0, 0.06, wbMatCreative);
    wb.position.set(p.x, 2.2, p.z + 3.8);
    roomGroup.add(wb);
    office.whiteboardCreative = wb;
    office.whiteboardMesh = wb;

    registerSpot(office, {
      id: 'whiteboard_spot',
      name: 'Creative Brainstorming Whiteboard',
      type: 'whiteboard',
      role: 'any',
      x: p.x,
      y: 0,
      z: p.z + 2.5,
      yaw: 0,
      activity: 'brainstorming',
      room: 'creative',
    });

    // Indoor ficus plant
    const pot = createCylinder(THREE, 0.3, 0.2, 0.6, 12, plantPotMat);
    pot.position.set(p.x - 6.5, 0.3, p.z - 2.5);
    roomGroup.add(pot);
    const leaves = createCylinder(THREE, 0.6, 0.3, 1.0, 10, leafMat);
    leaves.position.set(p.x - 6.5, 0.9, p.z - 2.5);
    roomGroup.add(leaves);
  }

  world.add(roomGroup);
  office.rooms[p.key] = roomGroup;
  return roomGroup;
}

// =============================================================================
// 5. LOBBY & BREAKROOM LOUNGE BUILDER
// =============================================================================

/**
 * Builds Lobby & Breakroom Lounge:
 * - PS gaming corner with wide TV, retro game screen, maroon couch, coffee table
 * - Water cooler dispenser & coffee espresso machine
 * - Snack vending machine
 * - Ping pong table with paddles and ball
 * - Plants and casual rug
 */
function buildLobby(world, p, office, THREE, materials = {}, SCREEN = {}) {
  office = ensureOffice(office);
  const lobbyGroup = new THREE.Group();
  lobbyGroup.name = 'room_lobby';

  const couchMat = getMaterial(materials, 'couch', 0x881337, THREE, { roughness: 0.8 }); // maroon
  const darkMat = getMaterial(materials, 'darkFrame', 0x111827, THREE, { roughness: 0.3 });
  const woodMat = getMaterial(materials, 'lightWood', 0x92400e, THREE, { roughness: 0.5 });
  const tableMat = getMaterial(materials, 'pingpongTable', 0x047857, THREE, { roughness: 0.4 }); // pingpong green
  const whiteMat = getMaterial(materials, 'whiteNet', 0xf8fafc, THREE, { roughness: 0.2 });
  const glassMat = getMaterial(materials, 'vendingGlass', 0x67e8f9, THREE, { transparent: true, opacity: 0.5 });

  // Lounge carpet
  const carpetMat = getMaterial(materials, 'carpet_lobby', p.carpetColor || 0x4c0519, THREE, { roughness: 0.9 });
  const carpet = createBox(THREE, p.width - 1.2, 0.05, p.depth - 1.2, carpetMat, false, true);
  carpet.position.set(p.x, 0.03, p.z);
  lobbyGroup.add(carpet);

  // ---------------------------------------------------------------------------
  // 1. PS GAMING CORNER (Left area of Lobby: X ~ 5 to 8, Z ~ 5 to 8)
  // ---------------------------------------------------------------------------
  const tvConsole = createBox(THREE, 2.6, 0.5, 0.8, darkMat);
  tvConsole.position.set(6.0, 0.25, 8.5);
  lobbyGroup.add(tvConsole);
  registerObstacle(office, 4.6, 7.4, 8.0, 9.0, 'tv_console');

  // Big Screen TV
  const tvFrame = createBox(THREE, 2.8, 1.7, 0.1, darkMat);
  tvFrame.position.set(6.0, 1.6, 8.6);
  lobbyGroup.add(tvFrame);

  const gameScreenMat = SCREEN.game || materials.screenGame || getMaterial(materials, 'screenGame', 0x7c3aed, THREE, {
    emissive: 0x6d28d9,
    emissiveIntensity: 0.6,
  });
  const tvDisplay = createBox(THREE, 2.6, 1.5, 0.05, gameScreenMat);
  tvDisplay.position.set(6.0, 1.6, 8.53);
  lobbyGroup.add(tvDisplay);
  office.animatedScreens.push({ type: 'game', mesh: tvDisplay });

  // PlayStation console on credenza
  const psConsole = createBox(THREE, 0.6, 0.08, 0.4, darkMat);
  psConsole.position.set(5.2, 0.54, 8.4);
  lobbyGroup.add(psConsole);

  // Large Comfortable Maroon Couch facing TV
  const couchBase = createBox(THREE, 3.2, 0.45, 1.1, couchMat);
  couchBase.position.set(6.0, 0.225, 5.2);
  lobbyGroup.add(couchBase);

  const couchBack = createBox(THREE, 3.2, 0.65, 0.35, couchMat);
  couchBack.position.set(6.0, 0.65, 4.7);
  lobbyGroup.add(couchBack);

  // Couch arms
  [-1.5, 1.5].forEach(ax => {
    const arm = createBox(THREE, 0.3, 0.55, 1.1, couchMat);
    arm.position.set(6.0 + ax, 0.45, 5.2);
    lobbyGroup.add(arm);
  });
  registerObstacle(office, 4.2, 7.8, 4.4, 5.8, 'lobby_couch');

  // Low Coffee Table between Couch and TV
  const coffeeTable = createBox(THREE, 1.8, 0.35, 0.8, woodMat);
  coffeeTable.position.set(6.0, 0.175, 6.8);
  lobbyGroup.add(coffeeTable);
  registerObstacle(office, 5.0, 7.0, 6.3, 7.3, 'coffee_table');

  // Gaming spot
  registerSpot(office, {
    id: 'lobby_gaming',
    name: 'PS Gaming Corner Lounge',
    type: 'gaming',
    role: 'any',
    x: 6.0,
    y: 0,
    z: 5.2,
    yaw: 0,
    activity: 'gaming',
    room: 'lobby',
  });

  // Architectural acoustic glass divider separating PS Gaming corner from pingpong lounge at x = 8.8
  const lobbyGlass = createGlassPartition(0.1, 2.4, 3.5, 8.8, 1.2, 5.75, office, THREE, materials, 'lobby_gaming_divider');
  lobbyGroup.add(lobbyGlass);
  registerObstacle(office, 8.6, 9.0, 4.0, 7.5, 'lobby_gaming_divider');

  // ---------------------------------------------------------------------------
  // 2. REFRESHMENT BAR: WATER DISPENSER, COFFEE MACHINE & VENDING MACHINE
  // ---------------------------------------------------------------------------
  // Pantry Counter along North-East partition (X: 13 to 17, Z: 2.8)
  const counter = createBox(THREE, 4.2, 0.85, 0.9, darkMat);
  counter.position.set(15.0, 0.425, 2.9);
  lobbyGroup.add(counter);
  registerObstacle(office, 12.8, 17.2, 2.3, 3.4, 'pantry_counter');

  // Automated Coffee Espresso Machine on counter at X = 13.8
  const coffeeBase = createBox(THREE, 0.7, 0.5, 0.5, darkMat);
  coffeeBase.position.set(13.8, 1.1, 2.9);
  lobbyGroup.add(coffeeBase);

  const coffeeSpout = createBox(THREE, 0.2, 0.1, 0.15, getMaterial(materials, 'silver', 0xe2e8f0, THREE, { metalness: 0.9 }));
  coffeeSpout.position.set(13.8, 0.95, 3.1);
  lobbyGroup.add(coffeeSpout);

  // Coffee spot
  registerSpot(office, {
    id: 'coffee_machine',
    name: 'Espresso Coffee Bar',
    type: 'coffee',
    role: 'any',
    x: 13.8,
    y: 0,
    z: 4.0,
    yaw: -Math.PI / 2,
    activity: 'coffee',
    room: 'lobby',
  });

  // Water Cooler Dispenser at X = 16.0
