/**
 * Builds Core Server Room & Datacenter (formerly Ruang Medis):
 * - High-density server rack arrays with dynamic blinking status LEDs
 * - West wall expansion racks and overhead cable trays
 * - Datacenter Master Monitoring Terminal & ergonomic chair for SysAdmin (Raka)
 * - Industrial backup power UPS cabinets
 */
function buildServerRoom(world, p, office, THREE, materials = {}, SCREEN = {}) {
  office = ensureOffice(office);
  const serverGroup = new THREE.Group();
  serverGroup.name = 'room_server';

  const rackFrameMat = getMaterial(materials, 'rackFrame', 0x0f172a, THREE, { metalness: 0.8, roughness: 0.3 });
  const rackDoorMat = getMaterial(materials, 'rackDoor', 0x1e293b, THREE, { metalness: 0.5, roughness: 0.4 });
  const serverUnitMat = getMaterial(materials, 'serverUnit', 0x334155, THREE, { roughness: 0.5 });
  const darkMat = getMaterial(materials, 'monitorDark', 0x030712, THREE, { metalness: 0.8 });
  const modernDeskMat = getMaterial(materials, 'modernDesk', 0x1f2937, THREE, { roughness: 0.3 });
  const chairMat = getMaterial(materials, 'chair', 0x111827, THREE, { roughness: 0.6 });
  const screenBorderMat = getMaterial(materials, 'monitorBezel', 0x030712, THREE, { metalness: 0.8 });

  // Server room dark metallic floor / carpet accent
  const carpetMat = getMaterial(materials, 'carpet_server', p.carpetColor || 0x0284c7, THREE, { roughness: 0.8 });
  const carpet = createBox(THREE, p.width - 1.2, 0.05, p.depth - 1.2, carpetMat, false, true);
  carpet.position.set(p.x, 0.03, p.z);
  serverGroup.add(carpet);

  // 1. High-Density Server Rack Arrays along North Wall (Z = -13.1)
  const northRackOffsets = [-2.2, 0, 2.2];
  northRackOffsets.forEach((rx, idx) => {
    const rackX = p.x + rx;
    const rack = createBox(THREE, 1.8, 3.3, 0.85, rackFrameMat);
    rack.position.set(rackX, 1.65, -13.1);
    serverGroup.add(rack);

    // Front mesh / bezel trim
    const bezel = createBox(THREE, 1.65, 3.1, 0.05, rackDoorMat);
    bezel.position.set(rackX, 1.65, -12.65);
    serverGroup.add(bezel);

    // 6 Hot-swappable server blade units per rack
    for (let s = 0; s < 6; s++) {
      const unitY = 0.45 + s * 0.48;
      const unit = createBox(THREE, 1.55, 0.38, 0.04, serverUnitMat);
      unit.position.set(rackX, unitY, -12.62);
      serverGroup.add(unit);

      // Blinking activity LEDs
      [-0.55, -0.25, 0.1, 0.35, 0.6].forEach((lx, lidx) => {
        const isGreen = (s + lidx + idx) % 2 === 0;
        const ledMat = getMaterial(materials, isGreen ? 'srvLedGreen' : 'srvLedAmber', isGreen ? 0x22c55e : 0xf59e0b, THREE, {
          emissive: isGreen ? 0x22c55e : 0xf59e0b,
          emissiveIntensity: 0.85,
        });
        const led = createBox(THREE, 0.04, 0.04, 0.02, ledMat);
        led.position.set(rackX + lx, unitY, -12.59);
        serverGroup.add(led);
        office.animatedLeds.push({ mesh: led, rate: 2 + ((s + lidx) % 3) });
      });
    }
  });
  registerObstacle(office, p.x - 3.4, p.x + 3.4, -13.7, -12.5, 'server_racks_north');

  // 2. High-Density Server Racks along West Wall (X = -17.2)
  const westRackZ = [-9.5, -6.5];
  westRackZ.forEach((rz, idx) => {
    const rack = createBox(THREE, 0.85, 3.3, 1.8, rackFrameMat);
    rack.position.set(-17.2, 1.65, rz);
    serverGroup.add(rack);

    const bezel = createBox(THREE, 0.05, 3.1, 1.65, rackDoorMat);
    bezel.position.set(-16.75, 1.65, rz);
    serverGroup.add(bezel);

    for (let s = 0; s < 6; s++) {
      const unitY = 0.45 + s * 0.48;
      const unit = createBox(THREE, 0.04, 0.38, 1.55, serverUnitMat);
      unit.position.set(-16.72, unitY, rz);
      serverGroup.add(unit);

      [-0.5, -0.2, 0.15, 0.45].forEach((lz, lidx) => {
        const isCyan = (s + lidx) % 2 === 0;
        const ledMat = getMaterial(materials, isCyan ? 'srvLedCyan' : 'srvLedGreen', isCyan ? 0x06b6d4 : 0x22c55e, THREE, {
          emissive: isCyan ? 0x06b6d4 : 0x22c55e,
          emissiveIntensity: 0.8,
        });
        const led = createBox(THREE, 0.02, 0.04, 0.04, ledMat);
        led.position.set(-16.69, unitY, rz + lz);
        serverGroup.add(led);
        office.animatedLeds.push({ mesh: led, rate: 3 + ((s + lidx) % 2) });
      });
    }
  });
  registerObstacle(office, -17.8, -16.5, -10.6, -5.4, 'server_racks_west');

  // 3. SysAdmin & DevOps Master Terminal Desk for Raka
  const termDeskX = -13.5;
  const termDeskZ = -7.5;
  const desk = createBox(THREE, 2.2, 0.75, 1.0, modernDeskMat);
  desk.position.set(termDeskX, 0.375, termDeskZ);
  serverGroup.add(desk);
  registerObstacle(office, -14.6, -12.4, -8.1, -6.9, 'server_terminal_desk');

  // Dual High-Tech Curved Diagnostic Screens on Terminal
  [-0.45, 0.45].forEach((mx, idx) => {
    const stand = createCylinder(THREE, 0.04, 0.04, 0.25, 8, screenBorderMat);
    stand.position.set(termDeskX + mx, 0.88, termDeskZ - 0.2);
    serverGroup.add(stand);

    const bezel = createBox(THREE, 0.85, 0.55, 0.05, screenBorderMat);
    bezel.position.set(termDeskX + mx, 1.15, termDeskZ - 0.2);
    bezel.rotation.y = mx > 0 ? -0.15 : 0.15;
    serverGroup.add(bezel);

    const srvTex = idx === 0
      ? (SCREEN.code || materials.codeTex)
      : (SCREEN.terminal || SCREEN.ecg || materials.codeTex);

    let srvScreenMat;
    if (srvTex) {
      srvScreenMat = new THREE.MeshStandardMaterial({
        map: srvTex,
        emissive: 0xffffff,
        emissiveMap: srvTex,
        emissiveIntensity: 0.85,
        roughness: 0.2,
        metalness: 0.1
      });
    } else {
      srvScreenMat = getMaterial(materials, idx === 0 ? 'screenSrvMetrics' : 'screenSrvLog', idx === 0 ? 0x0284c7 : 0x10b981, THREE, {
        emissive: idx === 0 ? 0x0284c7 : 0x10b981,
        emissiveIntensity: 0.7
      });
    }

    const screen = createBox(THREE, 0.8, 0.5, 0.02, srvScreenMat);
    screen.position.set(termDeskX + mx, 1.15, termDeskZ - 0.17);
    screen.rotation.y = mx > 0 ? -0.15 : 0.15;
    serverGroup.add(screen);
    office.animatedScreens.push({ type: idx === 0 ? 'code' : 'terminal', mesh: screen, agent: 'raka' });
  });

  // Terminal Keyboard & Mouse
  const kb = createBox(THREE, 0.55, 0.02, 0.2, screenBorderMat);
  kb.position.set(termDeskX, 0.76, termDeskZ + 0.15);
  serverGroup.add(kb);

  // Ergonomic Chair for SysAdmin (Raka)
  const chairZ = termDeskZ + 0.95; // -6.55
  const seat = createBox(THREE, 0.65, 0.08, 0.65, chairMat);
  seat.position.set(termDeskX, 0.48, chairZ);
  serverGroup.add(seat);
  const back = createBox(THREE, 0.65, 0.7, 0.1, chairMat);
  back.position.set(termDeskX, 0.85, chairZ + 0.3);
  serverGroup.add(back);

  // Register interactive desk spot for Raka
  registerSpot(office, {
    id: 'server_terminal',
    name: 'Datacenter Master Terminal',
    type: 'desk',
    role: 'raka',
    x: termDeskX,
    y: 0,
    z: chairZ,
    yaw: Math.PI,
    activity: 'maintenance',
    room: 'server',
  });

  // 4. Industrial Backup Power UPS Cabinet along East wall
  const ups = createBox(THREE, 0.6, 2.2, 1.6, darkMat);
  ups.position.set(-10.5, 1.1, -10.0);
  serverGroup.add(ups);
  registerObstacle(office, -10.9, -10.1, -10.9, -9.1, 'server_ups');

  // 5. Cleanroom Datacenter Glass Observation Partition along Z = -9.2
  // Separates Raka's Terminal Monitoring area from Server Racks
  const srvGlassL = createGlassPartition(2.8, 3.2, 0.1, -16.4, 1.6, -9.2, office, THREE, materials, 'srv_cleanroom_l');
  serverGroup.add(srvGlassL);
  registerObstacle(office, -17.8, -15.0, -9.4, -9.0, 'srv_cleanroom_l');

  const srvGlassR = createGlassPartition(1.8, 3.2, 0.1, -11.1, 1.6, -9.2, office, THREE, materials, 'srv_cleanroom_r');
  serverGroup.add(srvGlassR);
  registerObstacle(office, -12.0, -10.2, -9.4, -9.0, 'srv_cleanroom_r');

  // Sliding glass door transom header above walkway at x: -13.5
  const srvTransom = createDoorTransom(3.0, 3.2, 0.1, -13.5, -9.2, office, THREE, materials, 2.4);
  serverGroup.add(srvTransom);

  world.add(serverGroup);
  office.rooms.server = serverGroup;
  office.rooms.medical = serverGroup;
  return serverGroup;
}

// Backward compatibility alias
function buildMedical(world, p, office, THREE, materials = {}, SCREEN = {}) {
  return buildServerRoom(world, p, office, THREE, materials, SCREEN);

/**
 * Creates high-resolution procedural canvas texture for the MSAM Office outdoor monument signboard.
 * @param {object} THREE Three.js library instance
 * @returns {THREE.CanvasTexture|null}
 */
function createMsamOfficeBoardTexture(THREE) {
  if (typeof document === 'undefined') return null;

  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  if (!ctx) return null;

  // 1. Rich dark mahogany wood background
  const grad = ctx.createLinearGradient(0, 0, 1024, 512);
  grad.addColorStop(0, '#2d1305');
  grad.addColorStop(0.5, '#451a03');
  grad.addColorStop(1, '#1e0a02');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 512);

  // Subtle wood grain lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
  ctx.lineWidth = 2;
  for (let y = 10; y < 512; y += 14) {
    ctx.beginPath();
    ctx.moveTo(0, y + (Math.sin(y) * 4));
    ctx.bezierCurveTo(300, y - 6, 700, y + 6, 1024, y + (Math.cos(y) * 4));
    ctx.stroke();
  }

  // 2. Ornate Metallic Gold Outer Border
  ctx.strokeStyle = '#eab308';
  ctx.lineWidth = 14;
  ctx.strokeRect(16, 16, 1024 - 32, 512 - 32);

  ctx.strokeStyle = '#fef08a';
  ctx.lineWidth = 3;
  ctx.strokeRect(28, 28, 1024 - 56, 512 - 56);

  // Corner decorative studs
  const corners = [
    [40, 40], [1024 - 40, 40],
    [40, 512 - 40], [1024 - 40, 512 - 40]
  ];
  corners.forEach(([cx, cy]) => {
    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(cx, cy, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#854d0e';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // 3. Top Eyebrow Badge
  ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
  ctx.beginPath();
  ctx.roundRect(312, 55, 400, 44, 22);
  ctx.fill();
  ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#38bdf8';
  ctx.font = '800 18px Nunito, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏛️ AI AGENT VIRTUAL HEADQUARTERS', 512, 77);

  // 4. Main Title: "Sam's Virtual Office" (Bold gleaming gold & white)
  ctx.shadowColor = 'rgba(251, 191, 36, 0.7)';
  ctx.shadowBlur = 25;
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 64px Fredoka, Nunito, sans-serif';
  ctx.fillText("Sam's Virtual Office", 512, 215);

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fef08a';
  ctx.font = '900 64px Fredoka, Nunito, sans-serif';
  ctx.fillText("Sam's Virtual Office", 512, 215);

  // 5. Subtitle Tagline
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '700 24px Nunito, sans-serif';
  ctx.fillText('Autonomous Collaborative Intelligence Lab', 512, 290);

  // 6. Decorative divider with diamond
  ctx.strokeStyle = 'rgba(234, 179, 8, 0.6)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(260, 330);
  ctx.lineTo(470, 330);
  ctx.moveTo(554, 330);
  ctx.lineTo(764, 330);
  ctx.stroke();

  ctx.fillStyle = '#f59e0b';
  ctx.beginPath();
  ctx.moveTo(512, 320);
  ctx.lineTo(524, 330);
  ctx.lineTo(512, 340);
  ctx.lineTo(500, 330);
  ctx.closePath();
  ctx.fill();

  // 7. Live Metrics / Feature Pills at bottom
  const pills = [
    { text: '⚡ 6 Core Agents', color: '#38bdf8' },
    { text: '🤖 Subagent Spawner', color: '#a855f7' },
    { text: '🌐 Live WebSocket', color: '#22c55e' }
  ];
  const startX = 220;
  const pillW = 180;
  const pillGap = 22;
  pills.forEach((p, idx) => {
    const px = startX + idx * (pillW + pillGap);
    const py = 380;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.beginPath();
    ctx.roundRect(px, py, pillW, 46, 12);
    ctx.fill();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = p.color;
    ctx.font = '800 16px Nunito, sans-serif';
    ctx.fillText(p.text, px + pillW / 2, py + 23);
  });

  const texture = new THREE.CanvasTexture(canvas);
  if (THREE && THREE.SRGBColorSpace) {
    texture.colorSpace = THREE.SRGBColorSpace;
  }
  return texture;
}

/**
 * Builds outdoor yard:
 * - Minecraft-style voxel grass blocks (varied green tones and dirt base)
 * - Paved stone walkway leading from front doors
 * - Minecraft-style voxel trees with block trunks and foliage cubes
 * - Sam's Virtual Office monumental landmark signboard shifted to garden lawn
 */
function buildOutdoor(world, L, office, THREE, materials = {}) {
  office = ensureOffice(office);
  const outdoorGroup = new THREE.Group();
  outdoorGroup.name = 'yard_outdoor';

  const out = L.outdoor;
  const grassTones = [0x22c55e, 0x16a34a, 0x15803d, 0x4ade80]; // varied minecraft green shades
  const dirtColor = 0x78350f;
  const stoneColor = 0x64748b;
  const trunkColor = 0x854d0e;
  const foliageColor = 0x166534;

  const dirtMat = getMaterial(materials, 'voxelDirt', dirtColor, THREE, { roughness: 0.9 });
  const stoneMat = getMaterial(materials, 'voxelStone', stoneColor, THREE, { roughness: 0.8 });
  const trunkMat = getMaterial(materials, 'voxelTrunk', trunkColor, THREE, { roughness: 0.8 });
  const leafMat = getMaterial(materials, 'voxelLeaf', foliageColor, THREE, { roughness: 0.7 });
  const boardFrameMat = getMaterial(materials, 'boardFrame', 0x451a03, THREE, { roughness: 0.7 });

  // 1. Paved Stone Walkway extending from entrance (Z = 10 to 20)
  const walkW = out.walkway.width;
  const walkD = out.walkway.depth;
  const walkway = createBox(THREE, walkW, 0.12, walkD, stoneMat, false, true);
  walkway.position.set(out.walkway.x, -0.04, out.walkway.z);
  outdoorGroup.add(walkway);

  // 2. Minecraft Voxel Grass Blocks Grid
  // Generate a voxel landscape on left (X: -18 to -2) and right (X: 2 to 18)
  const blockSize = 1.2;
  const halfBlock = blockSize / 2;

  const voxelSectors = [
    { minX: -18, maxX: -2.4, minZ: 10.5, maxZ: 21.5 },
    { minX: 2.4, maxX: 18, minZ: 10.5, maxZ: 21.5 },
  ];

  voxelSectors.forEach(sec => {
    for (let x = sec.minX + halfBlock; x <= sec.maxX; x += blockSize) {
      for (let z = sec.minZ + halfBlock; z <= sec.maxZ; z += blockSize) {
        // Pseudo-random grass tone based on coordinates
        const hash = Math.abs(Math.sin(x * 12.9898 + z * 78.233) * 43758.5453);
        const toneIndex = Math.floor(hash) % grassTones.length;
        const grassMat = getMaterial(materials, `grass_${toneIndex}`, grassTones[toneIndex], THREE, { roughness: 0.9 });

        // Elevation variation (some blocks are single, some are slightly stepped)
        const elevation = (hash % 1.0 > 0.8) ? 0.3 : 0.0;
        const block = createBox(THREE, blockSize - 0.04, 0.3 + elevation, blockSize - 0.04, grassMat, false, true);
        block.position.set(x, -0.15 + elevation / 2, z);
        outdoorGroup.add(block);
      }
    }
  });

  // 3. Minecraft Voxel Trees (placed gracefully at perimeter so monument sign is unobstructed)
  const treeLocations = [
    { x: -15, z: 12 },
    { x: -15, z: 19 },
    { x: 14, z: 14 },
    { x: 8, z: 18 },
  ];

  treeLocations.forEach((t, tidx) => {
    // Tree Trunk (stacked voxel cubes)
    const trunkH = 2.4;
    const trunk = createBox(THREE, 0.6, trunkH, 0.6, trunkMat);
    trunk.position.set(t.x, trunkH / 2, t.z);
    outdoorGroup.add(trunk);
    registerObstacle(office, t.x - 0.6, t.x + 0.6, t.z - 0.6, t.z + 0.6, `tree_${tidx}`);

    // Foliage Layer 1 (Lower 3x3 cubic cluster)
    const folL1 = createBox(THREE, 2.2, 0.9, 2.2, leafMat);
    folL1.position.set(t.x, trunkH + 0.4, t.z);
    outdoorGroup.add(folL1);

    // Foliage Layer 2 (Upper 2x2 cubic cluster)
    const folL2 = createBox(THREE, 1.4, 0.9, 1.4, leafMat);
    folL2.position.set(t.x, trunkH + 1.2, t.z);
    outdoorGroup.add(folL2);
  });

  // 4. Task Garden Monument Signboard ("Sam's Virtual Office") shifted to garden lawn
  const bb = out.billboard;
  // Wooden posts

/**
 * Toggles glass facade vs solid walls.
 * When solid === false: front facade walls are transparent/hidden allowing camera to see inside.
 * When solid === true: walls are solid/opaque.
 */
function setWalls(office, solid, THREE) {
  if (!office) return;
  office.solidWalls = !!solid;

  // Update solid wall cutaways
  if (Array.isArray(office.wallMeshes)) {
    office.wallMeshes.forEach(mesh => {
      if (mesh.userData && mesh.userData.isFacadeCutaway) {
        mesh.visible = office.solidWalls;
      }
    });
  }

  // Update glass panels opacity
  if (Array.isArray(office.glassMeshes)) {
    office.glassMeshes.forEach(mesh => {
      if (mesh.material) {
        if (office.solidWalls) {
          mesh.material.transparent = false;
          mesh.material.opacity = 1.0;
        } else {
          mesh.material.transparent = true;
          mesh.material.opacity = 0.25;
        }
        mesh.material.needsUpdate = true;
      }
    });
  }
}

/**
 * AI Agent Office - Character Mesh, Animation, State Machine & A* Pathfinding
 * 
 * Exports:
 * - Grid: 2D obstacle grid with cell size 0.5, Binary Heap A*, and LOS smoothing
 * - Agent: 3D humanoid character with procedural face, animations, CSS2D tags, and state machine
 * - ROSTER: The 6 AI agent profiles (Kamala, Devin, Audit, Rani, Aura, Raka)
 * - initAgents: Factory function to spawn all agents into the 3D scene and office

// ============================================================================
// 1. MIN-HEAP (Priority Queue) FOR FAST A* PATHFINDING
// ============================================================================

class MinHeap {
  constructor(compareFn = (a, b) => a.f - b.f) {
    this.heap = [];
    this.compare = compareFn;
  }

  push(node) {
    this.heap.push(node);
    this._bubbleUp(this.heap.length - 1);
  }

  pop() {
    if (this.heap.length === 0) return null;
    const top = this.heap[0];
    const bottom = this.heap.pop();
    if (this.heap.length > 0) {
      this.heap[0] = bottom;
      this._bubbleDown(0);
    }
    return top;
  }

  get size() {
    return this.heap.length;
  }

  isEmpty() {
    return this.heap.length === 0;
  }

  _bubbleUp(idx) {
    const node = this.heap[idx];
    while (idx > 0) {
      const parentIdx = (idx - 1) >> 1;
      const parent = this.heap[parentIdx];
      if (this.compare(node, parent) >= 0) break;
      this.heap[idx] = parent;
      idx = parentIdx;
    }
    this.heap[idx] = node;
  }

  _bubbleDown(idx) {
    const length = this.heap.length;
    const node = this.heap[idx];
    while (true) {
      const leftIdx = (idx << 1) + 1;
      const rightIdx = leftIdx + 1;
      let swapIdx = null;

      if (leftIdx < length) {
        if (this.compare(this.heap[leftIdx], node) < 0) {
          swapIdx = leftIdx;
        }
      }
      if (rightIdx < length) {
        const compChild = swapIdx === null ? node : this.heap[leftIdx];
        if (this.compare(this.heap[rightIdx], compChild) < 0) {
          swapIdx = rightIdx;
        }
      }
      if (swapIdx === null) break;
      this.heap[idx] = this.heap[swapIdx];
      idx = swapIdx;
    }
    this.heap[idx] = node;
  }
}

// ============================================================================
// 2. 2D OBSTACLE GRID & BINARY-HEAP A* PATHFINDING WITH LOS SMOOTHING
// ============================================================================

class Grid {
  constructor(options = {}) {
    this.cellSize = options.cellSize || 0.5;
    this.minX = options.minX !== undefined ? options.minX : -20;
    this.maxX = options.maxX !== undefined ? options.maxX : 20;
    this.minZ = options.minZ !== undefined ? options.minZ : -20;
    this.maxZ = options.maxZ !== undefined ? options.maxZ : 20;

    this.cols = Math.ceil((this.maxX - this.minX) / this.cellSize);
    this.rows = Math.ceil((this.maxZ - this.minZ) / this.cellSize);
    this.grid = new Uint8Array(this.cols * this.rows);
  }

  /**
   * Convert world coordinates (x, z) to grid cell indices { gx, gz }.
   * Also iterable so `const [gx, gz] = grid.cell(x, z)` works seamlessly.
   */
  cell(x, z) {
    const gx = Math.floor((x - this.minX) / this.cellSize);
    const gz = Math.floor((z - this.minZ) / this.cellSize);
    const res = { gx, gz };
    res[Symbol.iterator] = function* () {
      yield gx;
      yield gz;
    };
    return res;
  }

  /**
   * Convert grid indices (gx, gz) to center world coordinates { x, z }.
   */
  world(gx, gz) {
    return {
      x: this.minX + (gx + 0.5) * this.cellSize,
      z: this.minZ + (gz + 0.5) * this.cellSize
    };
  }

  /**
   * Check if grid indices are within bounds.
   */
  inBounds(gx, gz) {
    return gx >= 0 && gx < this.cols && gz >= 0 && gz < this.rows;
  }

  /**
   * Check if a cell is blocked.
   */
  isBlocked(gx, gz) {
    if (!this.inBounds(gx, gz)) return true;
    return this.grid[gz * this.cols + gx] === 1;
  }

  /**
   * Check if world position is blocked.
   */
  isBlockedWorld(x, z) {
    const { gx, gz } = this.cell(x, z);
    return this.isBlocked(gx, gz);
  }

  /**
   * Mark a rectangular world region as blocked with optional padding.
   */
  block(x0, z0, x1, z1, pad = 0) {
    const minX = Math.min(x0, x1) - pad;
    const maxX = Math.max(x0, x1) + pad;
    const minZ = Math.min(z0, z1) - pad;
    const maxZ = Math.max(z0, z1) + pad;

    const c0 = this.cell(minX, minZ);
    const c1 = this.cell(maxX, maxZ);

    const startGx = Math.max(0, Math.min(c0.gx, this.cols - 1));
    const endGx = Math.max(0, Math.min(c1.gx, this.cols - 1));
    const startGz = Math.max(0, Math.min(c0.gz, this.rows - 1));
    const endGz = Math.max(0, Math.min(c1.gz, this.rows - 1));

    for (let gz = startGz; gz <= endGz; gz++) {
      for (let gx = startGx; gx <= endGx; gx++) {
        this.grid[gz * this.cols + gx] = 1;
      }
    }
  }

  /**
   * Unmark a rectangular world region.
   */
  unblock(x0, z0, x1, z1, pad = 0) {
    const minX = Math.min(x0, x1) - pad;
    const maxX = Math.max(x0, x1) + pad;
    const minZ = Math.min(z0, z1) - pad;
    const maxZ = Math.max(z0, z1) + pad;

    const c0 = this.cell(minX, minZ);
    const c1 = this.cell(maxX, maxZ);

    const startGx = Math.max(0, Math.min(c0.gx, this.cols - 1));
    const endGx = Math.max(0, Math.min(c1.gx, this.cols - 1));
    const startGz = Math.max(0, Math.min(c0.gz, this.rows - 1));
    const endGz = Math.max(0, Math.min(c1.gz, this.rows - 1));

    for (let gz = startGz; gz <= endGz; gz++) {
      for (let gx = startGx; gx <= endGx; gx++) {
        this.grid[gz * this.cols + gx] = 0;
      }
    }
  }

  /**
   * Find nearest unblocked cell to given coordinates.
   */
  findNearestFree(gx, gz, maxRadius = 4) {
    if (!this.isBlocked(gx, gz)) return { gx, gz };
    for (let r = 1; r <= maxRadius; r++) {
      for (let dx = -r; dx <= r; dx++) {
        for (let dz = -r; dz <= r; dz++) {
          if (Math.abs(dx) === r || Math.abs(dz) === r) {
            const nx = gx + dx;
            const nz = gz + dz;
            if (this.inBounds(nx, nz) && !this.isBlocked(nx, nz)) {
              return { gx: nx, gz: nz };
            }
          }
        }
      }
    }
    return null;
  }

  /**
   * Fast line-of-sight test between two world coordinates.
   * Samples points along line segment and checks clearance.
   */
  hasLineOfSight(x0, z0, x1, z1, clearance = 0.2) {
    const dx = x1 - x0;
    const dz = z1 - z0;
    const dist = Math.hypot(dx, dz);
    if (dist === 0) return true;

    const stepDist = this.cellSize * 0.35;
    const steps = Math.ceil(dist / stepDist);

    const nx = (-dz / dist) * clearance;
    const nz = (dx / dist) * clearance;

    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const x = x0 + dx * t;
      const z = z0 + dz * t;

      if (this.isBlockedWorld(x, z)) return false;
      if (clearance > 0) {
        if (this.isBlockedWorld(x + nx, z + nz)) return false;
        if (this.isBlockedWorld(x - nx, z - nz)) return false;
      }
    }
    return true;
  }

  /**
   * Line-of-sight waypoint smoothing (greedy string pulling).
   */
  smoothWaypoints(points) {
    if (!points || points.length <= 2) {
      return points ? points.map(p => ({ x: p.x, z: p.z })) : [];
    }

    const smoothed = [points[0]];
    let currentIdx = 0;

    while (currentIdx < points.length - 1) {
      let furthestIdx = currentIdx + 1;
      for (let testIdx = points.length - 1; testIdx > currentIdx + 1; testIdx--) {
        const p1 = points[currentIdx];
        const p2 = points[testIdx];
        if (this.hasLineOfSight(p1.x, p1.z, p2.x, p2.z)) {
          furthestIdx = testIdx;
          break;
        }
      }
      smoothed.push(points[furthestIdx]);
      currentIdx = furthestIdx;
    }

    return smoothed;
  }

  /**
   * Binary-heap optimized A* pathfinding between world coordinates `from` and `to`.
   * Returns an array of waypoints `[{ x, z }, ...]`.
   */
  path(from, to) {
    if (!from || !to) return [];

    const fromX = from.x !== undefined ? from.x : 0;
    const fromZ = from.z !== undefined ? from.z : 0;
    const toX = to.x !== undefined ? to.x : 0;
    const toZ = to.z !== undefined ? to.z : 0;

    let start = this.cell(fromX, fromZ);
    let goal = this.cell(toX, toZ);
    const startBlocked = this.isBlocked(start.gx, start.gz);
    const goalBlocked = this.isBlocked(goal.gx, goal.gz);

    // Direct line-of-sight shortcut if straight unobstructed line exists
    if (!startBlocked &&
        !goalBlocked &&
        this.hasLineOfSight(fromX, fromZ, toX, toZ)) {
      return [{ x: fromX, z: fromZ }, { x: toX, z: toZ }];
    }

    if (startBlocked) {
      const freeStart = this.findNearestFree(start.gx, start.gz, 4);
      if (freeStart) start = freeStart;
      else return [];
    }

    if (goalBlocked) {
      const freeGoal = this.findNearestFree(goal.gx, goal.gz, 4);
      if (freeGoal) goal = freeGoal;
      else return [];
    }

    if (start.gx === goal.gx && start.gz === goal.gz) {
      const endPt = goalBlocked ? this.world(goal.gx, goal.gz) : { x: toX, z: toZ };
      return [{ x: fromX, z: fromZ }, endPt];
    }

    const totalCells = this.cols * this.rows;
    const gScore = new Float32Array(totalCells);
    gScore.fill(Infinity);
    const closed = new Uint8Array(totalCells);
    const parentIdx = new Int32Array(totalCells);
    parentIdx.fill(-1);

    const startIndex = start.gz * this.cols + start.gx;
    const goalIndex = goal.gz * this.cols + goal.gx;

    gScore[startIndex] = 0;

    const heuristic = (gx, gz) => {
      const dx = Math.abs(gx - goal.gx);
      const dz = Math.abs(gz - goal.gz);
      // Octile distance heuristic
      return (dx + dz) + (1.41421356 - 2) * Math.min(dx, dz);
    };

    const openHeap = new MinHeap((a, b) => a.f - b.f);
    openHeap.push({
      gx: start.gx,
      gz: start.gz,
      index: startIndex,
      f: heuristic(start.gx, start.gz)
    });

    const NEIGHBORS = [
      { dx: 1, dz: 0, cost: 1.0 },
      { dx: -1, dz: 0, cost: 1.0 },
      { dx: 0, dz: 1, cost: 1.0 },
      { dx: 0, dz: -1, cost: 1.0 },
      { dx: 1, dz: 1, cost: 1.41421356 },
      { dx: -1, dz: 1, cost: 1.41421356 },
      { dx: 1, dz: -1, cost: 1.41421356 },
      { dx: -1, dz: -1, cost: 1.41421356 }
    ];

    let found = false;
    let iterations = 0;
    const maxIterations = 20000;

    while (!openHeap.isEmpty() && iterations++ < maxIterations) {
      const current = openHeap.pop();
      const currIdx = current.index;

      if (currIdx === goalIndex) {
        found = true;
        break;
      }

      if (closed[currIdx]) continue;
      closed[currIdx] = 1;

      const currentG = gScore[currIdx];

      for (let i = 0; i < NEIGHBORS.length; i++) {
        const nb = NEIGHBORS[i];
        const ngx = current.gx + nb.dx;
        const ngz = current.gz + nb.dz;

        if (!this.inBounds(ngx, ngz)) continue;
        const nIdx = ngz * this.cols + ngx;
        if (closed[nIdx] || this.grid[nIdx] === 1) continue;

        // Prevent corner-cutting through walls on diagonals
        if (nb.dx !== 0 && nb.dz !== 0) {
          if (this.isBlocked(current.gx + nb.dx, current.gz) ||
              this.isBlocked(current.gx, current.gz + nb.dz)) {
            continue;
          }
        }

        const tentativeG = currentG + nb.cost;
        if (tentativeG < gScore[nIdx]) {
          gScore[nIdx] = tentativeG;
          parentIdx[nIdx] = currIdx;
          const f = tentativeG + heuristic(ngx, ngz);
          openHeap.push({ gx: ngx, gz: ngz, index: nIdx, f });
        }
      }
    }

    if (!found) return [];

    // Reconstruct raw cell path
    const rawPath = [];
    let traceIdx = goalIndex;
    while (traceIdx !== -1) {
      const gz = Math.floor(traceIdx / this.cols);
      const gx = traceIdx % this.cols;
      const w = this.world(gx, gz);
      rawPath.push(w);
      if (traceIdx === startIndex) break;
      traceIdx = parentIdx[traceIdx];
    }
    rawPath.reverse();

    // Anchor ends to exact from and to coordinates (only if not blocked)
    if (rawPath.length > 0) {
      if (!startBlocked) {
        rawPath[0] = { x: fromX, z: fromZ };
      }
      if (!goalBlocked) {
        rawPath[rawPath.length - 1] = { x: toX, z: toZ };
      }
    }

    // Apply line-of-sight waypoint smoothing
    return this.smoothWaypoints(rawPath);
  }
}

// ============================================================================

function createProceduralFaceTexture(type = 'smile', THREE = null) {
  if (typeof document === 'undefined') return null;

  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  if (!ctx) return null;

  // Peach skin base tone
  ctx.fillStyle = '#fbe3c9';
  ctx.fillRect(0, 0, 128, 128);

  ctx.strokeStyle = '#232b38';
  ctx.fillStyle = '#232b38';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (type === 'focus') {
    // Focused slanted eyebrows
    ctx.beginPath();
    ctx.moveTo(26, 44); ctx.lineTo(54, 52);
    ctx.moveTo(74, 52); ctx.lineTo(102, 44);
    ctx.stroke();

    // Sharp focused pupils
    ctx.beginPath();
    ctx.arc(42, 64, 7, 0, Math.PI * 2);
    ctx.arc(86, 64, 7, 0, Math.PI * 2);
    ctx.fill();

    // Determined mouth line
    ctx.beginPath();
    ctx.moveTo(46, 94); ctx.lineTo(82, 94);
    ctx.stroke();
  } else if (type === 'sleep') {
    // Closed peaceful eyelids (arcs)
    ctx.beginPath();
    ctx.arc(42, 60, 14, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(86, 60, 14, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();

    // Small calm mouth
    ctx.beginPath();
    ctx.arc(64, 90, 5, 0, Math.PI * 2);
    ctx.stroke();

    // Sleepy zZz decorative symbols
    ctx.fillStyle = '#3498db';
    ctx.font = 'bold 22px Fredoka, sans-serif';
    ctx.fillText('z', 92, 38);
    ctx.font = 'bold 16px Fredoka, sans-serif';
    ctx.fillText('z', 106, 22);
  } else {
    // Default 'smile'
    // Friendly open eyes
    ctx.beginPath();
    ctx.arc(42, 54, 8, 0, Math.PI * 2);
    ctx.arc(86, 54, 8, 0, Math.PI * 2);
    ctx.fill();

    // Eye catchlights
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(40, 52, 2.5, 0, Math.PI * 2);
    ctx.arc(84, 52, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Cute blush cheeks
    ctx.fillStyle = 'rgba(231, 76, 60, 0.28)';
    ctx.beginPath();
    ctx.arc(30, 72, 11, 0, Math.PI * 2);
    ctx.arc(98, 72, 11, 0, Math.PI * 2);
    ctx.fill();

    // Cheerful smile
    ctx.beginPath();
    ctx.strokeStyle = '#232b38';
    ctx.arc(64, 72, 22, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
  }

  if (THREE && THREE.CanvasTexture) {
    const tex = new THREE.CanvasTexture(canvas);
    return tex;
  }
  return canvas;
}

class Agent {
  constructor(config = {}, grid = null, THREE = null, CSS2DObject = null) {
    this.id = config.id || 'agent';
    this.name = config.name || 'Agent';
    this.emoji = config.emoji || '🤖';
    this.role = config.role || 'Specialist';
    this.color = config.color !== undefined ? config.color : 0x3d7bff;
    this.title = config.title || this.role;
    this.room = config.room || 'dev';
    this.grid = grid;
    this.THREE = THREE;
    this.CSS2DObject = CSS2DObject;

    this.desk = config.desk ? { ...config.desk } : { x: 0, z: 0, yaw: 0 };
    this.lobbySpot = config.lobbySpot ? { ...config.lobbySpot } : null;
    this.defaultSpeech = config.speech || '';
    this.state = config.defaultState || 'idle';
    this.speechText = config.speech || '';

    // Movement & Waypoints
    this.waypoints = [];
    this.speed = 2.6; // units / sec
    this.walkCycle = Math.random() * 10;
    this.typingCycle = Math.random() * 10;
    this.baseY = 0;
    this.speechTimeout = null;

    // Build 3D mesh and DOM overlay
    this.faces = {};
    this._initMesh();
    this._initLabel();
    this.setState(this.state, this.speechText);
  }

  _initMesh() {
    const THREE = this.THREE;
    if (!THREE) {
      // Headless / Mock representation for unit tests
      this.mesh = {
        position: { x: 0, y: 0, z: 0, set(x, y, z) { this.x = x; this.y = y; this.z = z; } },
        rotation: { x: 0, y: 0, z: 0, set(x, y, z) { this.x = x; this.y = y; this.z = z; } },
        add: () => {}
      };
      this.leftArm = { rotation: { x: 0, y: 0, z: 0 } };
      this.rightArm = { rotation: { x: 0, y: 0, z: 0 } };
      this.leftLeg = { rotation: { x: 0, y: 0, z: 0 } };
      this.rightLeg = { rotation: { x: 0, y: 0, z: 0 } };
      return;
    }

    this.mesh = new THREE.Group();
    this.mesh.name = `agent-${this.id}`;

    // Procedural faces
    this.faces = {
      smile: createProceduralFaceTexture('smile', THREE),
      focus: createProceduralFaceTexture('focus', THREE),
      sleep: createProceduralFaceTexture('sleep', THREE)
    };

    // Body / Torso
    const bodyGeo = new THREE.BoxGeometry(0.48, 0.58, 0.28);
    const bodyMat = new THREE.MeshLambertMaterial({ color: this.color });
    this.bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    this.bodyMesh.position.y = 0.55;
    this.bodyMesh.castShadow = true;
    this.bodyMesh.receiveShadow = true;
    this.mesh.add(this.bodyMesh);

    // Head with procedural facial expressions
    const headGeo = new THREE.BoxGeometry(0.42, 0.42, 0.42);
    const skinMat = new THREE.MeshLambertMaterial({ color: 0xfbe3c9 });
    this.faceMat = new THREE.MeshLambertMaterial({
      map: this.faces.smile,
      color: 0xffffff
    });

    // Box materials: [+X, -X, +Y, -Y, +Z (face), -Z]
    this.headMaterials = [
      skinMat, skinMat, skinMat, skinMat, this.faceMat, skinMat
    ];
    this.headMesh = new THREE.Mesh(headGeo, this.headMaterials);
    this.headMesh.position.y = 1.05;
    this.headMesh.castShadow = true;
    this.mesh.add(this.headMesh);

    // Hair cap / trim
    const hairGeo = new THREE.BoxGeometry(0.44, 0.12, 0.44);
    const hairMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
    const hairMesh = new THREE.Mesh(hairGeo, hairMat);
    hairMesh.position.y = 1.25;
    this.mesh.add(hairMesh);

    // Left Arm Pivot & Mesh
    this.leftArmPivot = new THREE.Group();
    this.leftArmPivot.position.set(-0.31, 0.76, 0);
    const armGeo = new THREE.BoxGeometry(0.13, 0.46, 0.13);
    const armMat = new THREE.MeshLambertMaterial({ color: this.color });
    const leftArmMesh = new THREE.Mesh(armGeo, armMat);
    leftArmMesh.position.y = -0.22;
    leftArmMesh.castShadow = true;
    this.leftArmPivot.add(leftArmMesh);
    this.mesh.add(this.leftArmPivot);
    this.leftArm = this.leftArmPivot;

    // Right Arm Pivot & Mesh
    this.rightArmPivot = new THREE.Group();
    this.rightArmPivot.position.set(0.31, 0.76, 0);
    const rightArmMesh = new THREE.Mesh(armGeo, armMat);
    rightArmMesh.position.y = -0.22;
    rightArmMesh.castShadow = true;
    this.rightArmPivot.add(rightArmMesh);
    this.mesh.add(this.rightArmPivot);
    this.rightArm = this.rightArmPivot;

    // Left Leg Pivot & Mesh
    this.leftLegPivot = new THREE.Group();
    this.leftLegPivot.position.set(-0.14, 0.35, 0);
    const legGeo = new THREE.BoxGeometry(0.15, 0.44, 0.15);
    const pantsMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
    const leftLegMesh = new THREE.Mesh(legGeo, pantsMat);
    leftLegMesh.position.y = -0.21;
    leftLegMesh.castShadow = true;
    this.leftLegPivot.add(leftLegMesh);
    this.mesh.add(this.leftLegPivot);
    this.leftLeg = this.leftLegPivot;

    // Right Leg Pivot & Mesh
    this.rightLegPivot = new THREE.Group();
    this.rightLegPivot.position.set(0.14, 0.35, 0);
    const rightLegMesh = new THREE.Mesh(legGeo, pantsMat);
    rightLegMesh.position.y = -0.21;
    rightLegMesh.castShadow = true;
    this.rightLegPivot.add(rightLegMesh);
    this.mesh.add(this.rightLegPivot);
    this.rightLeg = this.rightLegPivot;
  }

  _initLabel() {
    if (typeof document === 'undefined') {
      // Mock DOM element for tests
      this.domElement = {
        className: '',
        style: {},
        querySelector: () => ({ textContent: '', style: {} })
      };
      return;
    }

    const container = document.createElement('div');
    container.className = `lbl lbl-${this.id} state-${this.state}`;
    container.id = `lbl-${this.id}`;
    container.dataset.botId = this.id;
    container.setAttribute('data-bot-id', this.id);

    const speechBubble = document.createElement('div');
    speechBubble.className = 'speech-bubble bub';
    speechBubble.style.display = this.speechText ? 'block' : 'none';
    speechBubble.textContent = this.speechText || '';

    const nameBadge = document.createElement('div');
    nameBadge.className = 'name-badge name';

    const dot = document.createElement('span');
    dot.className = 'status-dot dot';

    const nameText = document.createElement('span');
    nameText.className = 'name-text';
    nameText.textContent = `${this.emoji} ${this.name}`;

    nameBadge.appendChild(dot);
    nameBadge.appendChild(nameText);

    const roleTag = document.createElement('div');
    roleTag.className = 'role-tag role';
    roleTag.textContent = this.role;

    container.appendChild(speechBubble);
    container.appendChild(nameBadge);
    container.appendChild(roleTag);

    this.domElement = container;
    this.bubElement = speechBubble;
    this.dotElement = dot;

    if (this.CSS2DObject && this.mesh && this.mesh.add) {
      this.cssLabel = new this.CSS2DObject(container);
      this.cssLabel.position.set(0, 1.95, 0);
      this.mesh.add(this.cssLabel);
    }
  }

  /**
   * Set face expression: 'smile', 'focus', or 'sleep'.
   */
  setFace(type) {
    if (this.faceMat && this.faces[type]) {
      this.faceMat.map = this.faces[type];
      this.faceMat.needsUpdate = true;
    }
  }

  /**
   * Set agent status and update posture, facial expression, and tags.
   * Valid states: 'working', 'recent', 'idle', 'blocked', 'offline'.
   */
  setState(newState, speech = null) {
    this.state = newState;

    // Face selection
    if (newState === 'offline') {
      this.setFace('sleep');
    } else if (newState === 'working' || newState === 'blocked') {
      this.setFace('focus');
    } else {
      this.setFace('smile');
    }

    // Update DOM classes
    if (this.domElement) {
      this.domElement.className = `lbl lbl-${this.id} state-${newState}`;
    }

    // Default posture adjustments
    if (newState === 'offline') {
      if (this.mesh && this.mesh.rotation) {
        this.mesh.rotation.x = -Math.PI / 2;
        this.mesh.position.y = 0.25;
      }
    } else {
      if (this.mesh && this.mesh.rotation) {
        this.mesh.rotation.x = 0;
        this.mesh.position.y = (newState === 'working') ? (this.baseY + 0.25) : this.baseY;
      }
    }

    if (speech !== null) {
      this.say(speech);
    }
  }

  /**
   * Show a speech bubble with custom text.
   */
  say(text, duration = 4500) {
    this.speechText = text;
    if (this.bubElement) {
      this.bubElement.textContent = text;
      this.bubElement.style.display = 'block';
    }

    if (this.speechTimeout) {
      clearTimeout(this.speechTimeout);
      this.speechTimeout = null;
    }

    if (duration > 0 && typeof setTimeout !== 'undefined') {
      this.speechTimeout = setTimeout(() => {
        if (this.bubElement) {
          this.bubElement.style.display = 'none';
        }
      }, duration);
    }
  }

  /**
   * Set position and orientation immediately.
   */
  setPosition(x, y, z, yaw = 0) {
    this.baseY = y;
    if (this.mesh && this.mesh.position) {
      this.mesh.position.set(x, this.state === 'working' ? (y + 0.25) : y, z);
    }
    if (this.mesh && this.mesh.rotation) {
      this.mesh.rotation.y = yaw;
    }
  }

  /**
   * Navigate to a world target point using A* pathfinding.
   * Supports targetPos object { x, z, yaw } or coordinates (x, z, yaw, onComplete).
   */
  walkTo(...args) {
    if (!this.grid) return [];

    let targetPos = null;
    let onComplete = null;

    if (typeof args[0] === 'object' && args[0] !== null) {
      targetPos = { ...args[0] };
      if (typeof args[1] === 'function') onComplete = args[1];
    } else if (typeof args[0] === 'number' && typeof args[1] === 'number') {
      targetPos = { x: args[0], z: args[1] };
      if (typeof args[2] === 'number') {
        targetPos.yaw = args[2];
        if (typeof args[3] === 'function') onComplete = args[3];
      } else if (typeof args[2] === 'function') {
        onComplete = args[2];
      }
    }

    if (!targetPos) return [];

    const targetYaw = targetPos.yaw !== undefined ? targetPos.yaw : (this.desk ? this.desk.yaw : undefined);
    this.finalTarget = {
      x: targetPos.x,
      z: targetPos.z,
      yaw: targetYaw
    };
    this.onMoveComplete = onComplete;

    const fromPos = {
      x: this.mesh ? this.mesh.position.x : 0,
      z: this.mesh ? this.mesh.position.z : 0
    };

    const path = this.grid.path(fromPos, targetPos);
    if (path && path.length > 0) {
      // Store waypoints excluding the initial position
      this.waypoints = path.slice(1);
      // Ensure the destination waypoint snaps directly to exact target coordinates
      if (this.waypoints.length > 0) {
        this.waypoints[this.waypoints.length - 1] = { x: targetPos.x, z: targetPos.z };
      } else {
        this.waypoints = [{ x: targetPos.x, z: targetPos.z }];
      }
    } else {
      this.waypoints = [{ x: targetPos.x, z: targetPos.z }];
    }

    return this.waypoints;
  }

  /**
   * Per-frame animation and movement loop tick.
   * @param {number} dt Delta time in seconds
   */
  update(dt = 0.016) {
    // 1. Walking along waypoints
    if (this.waypoints && this.waypoints.length > 0) {
      const targetWp = this.waypoints[0];
      const curX = this.mesh.position.x;
      const curZ = this.mesh.position.z;
      const dx = targetWp.x - curX;
      const dz = targetWp.z - curZ;
      const dist = Math.hypot(dx, dz);

      // Smooth body rotation towards movement velocity vector
      const targetAngle = Math.atan2(dx, dz);
      let diff = targetAngle - this.mesh.rotation.y;
      while (diff < -Math.PI) diff += Math.PI * 2;
      while (diff > Math.PI) diff -= Math.PI * 2;
      this.mesh.rotation.y += diff * Math.min(1, dt * 10);

      // Advance position
      const step = this.speed * dt;
      if (dist <= step) {
        this.mesh.position.x = targetWp.x;
        this.mesh.position.z = targetWp.z;
        this.waypoints.shift();

        // Snap to destination and align orientation upon arrival
        if (this.waypoints.length === 0) {
          if (this.finalTarget) {
            this.mesh.position.x = this.finalTarget.x;
            this.mesh.position.z = this.finalTarget.z;
            if (this.finalTarget.yaw !== undefined) {
              this.mesh.rotation.y = this.finalTarget.yaw;
            } else if (this.desk && this.desk.yaw !== undefined) {
              this.mesh.rotation.y = this.desk.yaw;
            }
          }

          if (this.leftLeg) this.leftLeg.rotation.x = 0;
          if (this.rightLeg) this.rightLeg.rotation.x = 0;
          if (this.leftArm) this.leftArm.rotation.x = 0;
          if (this.rightArm) this.rightArm.rotation.x = 0;

          if (typeof this.onMoveComplete === 'function') {
            const cb = this.onMoveComplete;
            this.onMoveComplete = null;
            cb();
          }
          if (typeof this._despawnCallback === 'function') {
            const dcb = this._despawnCallback;
            this._despawnCallback = null;
            dcb();
          }
        }
      } else {
        this.mesh.position.x += (dx / dist) * step;
        this.mesh.position.z += (dz / dist) * step;
      }

      // Walking leg/arm swing cycle (negative rotation.x swings forward towards +Z)
      this.walkCycle += dt * 9;
      const legSwing = Math.sin(this.walkCycle) * 0.55;
      const armSwing = Math.cos(this.walkCycle) * 0.55;

      if (this.leftLeg) this.leftLeg.rotation.x = -legSwing;
      if (this.rightLeg) this.rightLeg.rotation.x = legSwing;
      if (this.leftArm) this.leftArm.rotation.x = armSwing;
      if (this.rightArm) this.rightArm.rotation.x = -armSwing;

      // Subtle step bobbing
      this.mesh.position.y = this.baseY + Math.abs(Math.sin(this.walkCycle)) * 0.04;
      return;
    }

    // 2. Stationary state animations
    if (this.state === 'working') {
      // Sitting at desk typing: arms and legs reach forward towards +Z (desk and keyboard)
      this.typingCycle += dt * 12;
      const typeLeft = -(0.7 + Math.sin(this.typingCycle) * 0.15);
      const typeRight = -(0.7 + Math.cos(this.typingCycle) * 0.15);

      if (this.leftArm) this.leftArm.rotation.x = typeLeft;
      if (this.rightArm) this.rightArm.rotation.x = typeRight;
      if (this.leftLeg) this.leftLeg.rotation.x = -Math.PI / 2.2;
      if (this.rightLeg) this.rightLeg.rotation.x = -Math.PI / 2.2;
      this.mesh.position.y = this.baseY + 0.25;

      // Ensure orientation faces desk when working and not walking
      if (this.desk && this.desk.yaw !== undefined && (!this.waypoints || this.waypoints.length === 0)) {
        this.mesh.rotation.y = this.desk.yaw;
      }
    } else if (this.state === 'offline') {
      // Resting on bed
      if (this.leftArm) this.leftArm.rotation.x = 0;
      if (this.rightArm) this.rightArm.rotation.x = 0;
      if (this.leftLeg) this.leftLeg.rotation.x = 0;
      if (this.rightLeg) this.rightLeg.rotation.x = 0;
      this.mesh.rotation.x = -Math.PI / 2;
      this.mesh.position.y = 0.25;
    } else {
      // Standing / Idle / Recent / Blocked
      this.typingCycle += dt * 2.5;
      const breathe = Math.sin(this.typingCycle) * 0.05;

      if (this.leftLeg) this.leftLeg.rotation.x = 0;
      if (this.rightLeg) this.rightLeg.rotation.x = 0;
      if (this.leftArm) this.leftArm.rotation.x = breathe;
      if (this.rightArm) this.rightArm.rotation.x = -breathe;

      this.mesh.rotation.x = 0;
      this.mesh.position.y = this.baseY;
    }
  }
}

// 6. INITIALIZE AND SPAWN AGENTS IN THE OFFICE
// ============================================================================

/**
 * Spawns all agents in their designated rooms according to ROSTER and office spots.
 * @param {THREE.Scene} scene The 3D scene to add agent meshes to
 * @param {object} office Office layout containing .grid and .spots
 * @param {object|Map} bots Container dictionary or map for spawned agents
 * @param {object} THREE Three.js library instance
 * @param {function} CSS2DObject CSS2DObject class
 * @returns {object|Map} The populated bots container
 */
function initAgents(scene, office, bots = {}, THREE = null, CSS2DObject = null) {
  const grid = office && office.grid ? office.grid : null;

  ROSTER.forEach(config => {
    // Find designated spot from office layout if defined
    let spot = null;
    if (office && office.spots) {
      spot = office.spots.find(s => s.role === config.id || s.agentId === config.id || s.name === config.id);
    }
    const deskPos = spot ? { x: spot.x, z: spot.z, yaw: spot.yaw !== undefined ? spot.yaw : (config.desk ? config.desk.yaw : 0) } : config.desk;

    const agent = new Agent(
      { ...config, desk: deskPos },
      grid,
      THREE,
      CSS2DObject
    );

    // Default spawn position: bersantai di lobby jika lobbySpot ada, atau di meja kerja
    const initialPos = config.lobbySpot || deskPos;
    if (initialPos) {
      agent.setPosition(initialPos.x, initialPos.y || 0, initialPos.z, initialPos.yaw !== undefined ? initialPos.yaw : 0);
    }

    if (scene && scene.add && agent.mesh) {
      scene.add(agent.mesh);
    }

    bots[config.id] = agent;
    if (bots.set && typeof bots.set === 'function') {
      bots.set(config.id, agent);
    }
  });

  return bots;
}

// -----------------------------------------------------------------------------
// 3. Smooth Camera Focus Helper
// -----------------------------------------------------------------------------
function focusOn(key, camera, controls, onFocus) {
  if (!key) return;
  const normKey = String(key).toLowerCase().trim();
  
  let targetPreset = ROOM_TARGETS[normKey];
  if (!targetPreset) {
    // Map Indonesian category names or partial keys
    if (normKey.includes('semua') || normKey === 'all') targetPreset = ROOM_TARGETS.all;
    else if (normKey.includes('ceo')) targetPreset = ROOM_TARGETS.ceo;
    else if (normKey.includes('dev') || normKey.includes('ops')) targetPreset = ROOM_TARGETS.dev;
    else if (normKey.includes('creative') || normKey.includes('kreatif')) targetPreset = ROOM_TARGETS.creative;
    else if (normKey.includes('lobby') || normKey.includes('lobi')) targetPreset = ROOM_TARGETS.lobby;
    else if (normKey.includes('server') || normKey.includes('datacenter') || normKey.includes('medis') || normKey.includes('clinic')) targetPreset = ROOM_TARGETS.server;
    else if (normKey.includes('taman') || normKey.includes('garden')) targetPreset = ROOM_TARGETS.garden;
    else targetPreset = ROOM_TARGETS.all;
  }

  if (typeof onFocus === 'function') {
    onFocus(normKey, targetPreset);
  }

  // Smooth camera interpolation if Three.js camera and controls exist
  if (camera && controls) {
    const [tx, ty, tz] = targetPreset.target;
    const [px, py, pz] = targetPreset.pos;

    if (typeof requestAnimationFrame === 'function') {
      const startT = { x: controls.target.x, y: controls.target.y, z: controls.target.z };
      const startP = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
      const duration = 600; // ms
      const startTime = (typeof performance !== 'undefined' ? performance.now() : Date.now());

      const animateTween = (now) => {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);
        // Smooth easeInOutCubic
        const ease = progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2;

        controls.target.x = startT.x + (tx - startT.x) * ease;
        controls.target.y = startT.y + (ty - startT.y) * ease;
        controls.target.z = startT.z + (tz - startT.z) * ease;

        camera.position.x = startP.x + (px - startP.x) * ease;
        camera.position.y = startP.y + (py - startP.y) * ease;
        camera.position.z = startP.z + (pz - startP.z) * ease;

        if (controls.update) controls.update();

        if (progress < 1) {
          requestAnimationFrame(animateTween);
        }
      };
      requestAnimationFrame(animateTween);
    } else {
      // Direct set for non-animation / test environments
      controls.target.set?.(tx, ty, tz) || Object.assign(controls.target, { x: tx, y: ty, z: tz });
      camera.position.set?.(px, py, pz) || Object.assign(camera.position, { x: px, y: py, z: pz });
      if (controls.update) controls.update();
    }
  }

  return targetPreset;
}

// 4. Top HUD Initialization

function initHUD(document, bots, office, camera, controls, onFocus) {
  if (!document) return null;

  // 1. Metric elements
  const elAct = document.getElementById('sAct') || document.querySelector?.('#sAct');
  const elSes = document.getElementById('sSes') || document.querySelector?.('#sSes');
  const elCost = document.getElementById('sCost') || document.querySelector?.('#sCost');
  const elApprove = document.getElementById('sApprove') || document.querySelector?.('#sApprove');
  const elVps = document.getElementById('sVps') || document.querySelector?.('#sVps');
  const elUpd = document.getElementById('upd') || document.querySelector?.('#upd');

  const hudMetrics = {
    activeAgents: 6,
    totalAgents: 6,
    tasksCompleted: 42,
    tokenCost: 1.42,
    approvals: 0,
    vpsHealth: '99.9% · 24% CPU'
  };

  const updateDisplay = (metrics = {}) => {
    Object.assign(hudMetrics, metrics);
    if (elAct) elAct.textContent = `${hudMetrics.activeAgents} / ${hudMetrics.totalAgents}`;
    if (elSes) elSes.textContent = `${hudMetrics.tasksCompleted}`;
    if (elCost) elCost.textContent = `$${Number(hudMetrics.tokenCost).toFixed(2)}`;
    if (elApprove) elApprove.textContent = `${hudMetrics.approvals}`;
    if (elVps) elVps.textContent = `${hudMetrics.vpsHealth}`;
    if (elUpd) elUpd.textContent = '● Terhubung · Simulasi aktif';
  };

  updateDisplay();

  // 2. Category Filter Tabs: [Semua], [CEO], [Dev & Ops], [Creative], [Lobby], [Server], [Taman]
  const tabKeys = ['all', 'ceo', 'dev', 'creative', 'lobby', 'server', 'garden'];
  const tabLabels = {
    all: 'Semua',
    ceo: 'CEO',
    dev: 'Dev & Ops',
    creative: 'Creative',
    lobby: 'Lobby',
    server: 'Server',
    medical: 'Server',
    garden: 'Taman'
  };

  const tabsContainer = document.getElementById('tabs') || document.querySelector?.('#tabs');
  const tabButtons = tabsContainer ? Array.from(tabsContainer.querySelectorAll('button, .tab')) : [];

  const handleTabClick = (key, btnEl) => {
    if (tabsContainer) {
      tabsContainer.querySelectorAll('button, .tab').forEach(b => {
        b.classList?.remove('active');
        if (b.removeAttribute) b.removeAttribute('data-active');
      });
    }
    if (btnEl) {
      btnEl.classList?.add('active');
      if (btnEl.setAttribute) btnEl.setAttribute('data-active', 'true');
    }
    focusOn(key, camera, controls, onFocus);
  };

  if (tabButtons.length > 0) {
    tabButtons.forEach(btn => {
      const key = btn.dataset?.tab || btn.getAttribute?.('data-tab') || btn.textContent?.toLowerCase() || '';
      btn.addEventListener?.('click', () => handleTabClick(key, btn));
    });
  } else if (tabsContainer) {
    // Dynamically render tabs if container exists without buttons
    tabKeys.forEach((key, idx) => {
      const btn = document.createElement?.('button');
      if (btn) {
        btn.className = `tab ${idx === 0 ? 'active' : ''}`;
        btn.textContent = tabLabels[key];
        btn.setAttribute?.('data-tab', key);
        btn.addEventListener?.('click', () => handleTabClick(key, btn));
        tabsContainer.appendChild?.(btn);
      }
    });
  }

  // 3. Action buttons: 🧱 Tembok, 🎬 Demo, 📋 Task Board, 🔄 Reset View
  let wallsSolid = false;
  let demoActive = false;

  // Toggle Floating Character Name Badges
  let labelsVisible = true;
  const btnToggleLabels = document.getElementById('btnToggleLabels') || document.querySelector?.('#btnToggleLabels');
  const toggleLabels = (forceVal) => {
    labelsVisible = typeof forceVal === 'boolean' ? forceVal : !labelsVisible;
    if (document.body) {
      document.body.classList.toggle('labels-hidden', !labelsVisible);
    }
    if (btnToggleLabels) {
      btnToggleLabels.classList.toggle('active', !labelsVisible);
      btnToggleLabels.textContent = labelsVisible ? '🏷️ Label: On' : '🏷️ Label: Off';
      btnToggleLabels.setAttribute('aria-pressed', labelsVisible ? 'true' : 'false');
    }
  };

  if (btnToggleLabels) {
    btnToggleLabels.addEventListener('click', () => toggleLabels());
  }

  // Keyboard shortcut: Press 'N' or 'H' to toggle badges (when not typing in inputs)
  if (typeof window !== 'undefined') {
    window.addEventListener('keydown', (e) => {
      if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
      if (e.key === 'n' || e.key === 'N' || e.key === 'h' || e.key === 'H') {
        toggleLabels();
      }
    });
  }

  const btnWalls = document.getElementById('walls') || document.querySelector?.('#walls, [data-action="walls"]');
  if (btnWalls) {
    btnWalls.addEventListener?.('click', () => {
      wallsSolid = !wallsSolid;
      if (office && typeof office.setWalls === 'function') {
        office.setWalls(wallsSolid);
      }
      btnWalls.classList?.toggle('active', wallsSolid);
    });
  }

  const btnDemo = document.getElementById('demo') || document.querySelector?.('#demo, [data-action="demo"]');
  if (btnDemo) {
    btnDemo.addEventListener?.('click', () => {
      demoActive = !demoActive;
      btnDemo.classList?.toggle('active', demoActive);
    });
  }

  const btnBoard = document.getElementById('board') || document.querySelector?.('#board, [data-action="board"]');
  if (btnBoard) {
    btnBoard.addEventListener?.('click', () => {
      const boardDlg = document.getElementById('dlgBoard') || document.getElementById('dlg');
      if (boardDlg && typeof boardDlg.showModal === 'function') {
        boardDlg.showModal();
      }
    });
  }

  const btnReset = document.getElementById('reset') || document.querySelector?.('#reset, [data-action="reset"]');
  if (btnReset) {
    btnReset.addEventListener?.('click', () => {
      handleTabClick('all', tabButtons[0] || tabsContainer?.firstElementChild);
    });
  }

  return {
    metrics: hudMetrics,
    updateDisplay,
    focusOn: (k) => focusOn(k, camera, controls, onFocus),
    setWalls: (val) => {
      wallsSolid = val;
      if (office && typeof office.setWalls === 'function') office.setWalls(wallsSolid);
    },
    isDemo: () => demoActive,
    toggleDemo: () => {
      demoActive = !demoActive;
      return demoActive;
    }
  };
}

// -----------------------------------------------------------------------------
// 6. Autonomous Simulation Engine
// -----------------------------------------------------------------------------
function startSimulation(bots, office, updateHUD, options = {}) {
  const intervalMs = options.intervalMs || 5000;
  let isDemoMode = Boolean(options.demo);
  let isRunning = true;
  let timerId = null;

  // HUD stats
  const metrics = {
    activeAgents: 6,
    totalAgents: 6,
    tasksCompleted: 42,
    tokenCost: 1.42,
    approvals: 0,
    vpsHealth: '99.9% · 24% CPU'
  };

  // Convert bots to array for iteration
  const getBotsList = () => {
    if (!bots) return [];
    if (Array.isArray(bots)) return bots;
    if (typeof bots.values === 'function') return Array.from(bots.values());
    return Object.keys(bots).map(k => bots[k]);
  };

  // State machine sequence: working -> recent -> idle -> back to working
  const nextStateMap = {
    working: 'recent',
    recent: 'idle',
    idle: 'working',
    blocked: 'recent',
    offline: 'working'
  };

  let tickCount = 0;

  // Single simulation step
  const tick = () => {
    tickCount++;
    const botList = getBotsList();

    // Occasional blocked scenario (waiting human approval) every 3rd or 4th tick if approvals is 0
    let triggeredBlocked = false;
    if (tickCount % 4 === 2 && metrics.approvals === 0) {
      triggeredBlocked = true;
    }

    let currentBlockedCount = 0;
    let activeCount = 0;

    botList.forEach((bot, index) => {
      if (!bot) return;

      const botId = bot.id || Object.keys(AGENT_ROLES)[index] || 'devin';
      const roleMeta = AGENT_ROLES[botId] || {};

      // If blocked scenario triggered, pick builder or devops for human approval
      if (triggeredBlocked && (botId === 'devin' || botId === 'raka') && currentBlockedCount === 0) {
        bot.state = 'blocked';
        bot.stateDuration = '1m';
        const warnQuote = AGENT_DIALOGUES[botId]?.blocked?.[0] || '⚠️ Menunggu approval human untuk eksekusi!';
        if (typeof bot.say === 'function') bot.say(warnQuote);
        bot.speech = warnQuote;
        bot.bubbleText = warnQuote;
      } else if (bot.state === 'blocked') {
        // Resolve blocked after 1 cycle
        bot.state = 'working';
        bot.stateDuration = '2m';
        metrics.tasksCompleted += 1;
        const resQuote = '✅ Approval disetujui: Melanjutkan eksekusi task!';
        if (typeof bot.say === 'function') bot.say(resQuote);
        bot.speech = resQuote;
        bot.bubbleText = resQuote;
      } else {
        // Normal cycle state transition with 35% probability per tick
        if (Math.random() < 0.35 || isDemoMode) {
          const prevState = bot.state || 'working';
          const newState = nextStateMap[prevState] || 'working';
          bot.state = newState;
          bot.stateDuration = `${Math.floor(Math.random() * 8) + 1}m`;

          if (prevState === 'working' && (newState === 'recent' || newState === 'idle')) {
            metrics.tasksCompleted += 1;
            metrics.tokenCost += +(0.03 + Math.random() * 0.05).toFixed(2);
          }

          // Pick contextual speech
          const quotes = AGENT_DIALOGUES[botId]?.[newState] || [`Aktivitas ${newState} ${roleMeta.role || ''}`];
          const chosenQuote = quotes[Math.floor(Math.random() * quotes.length)];
          if (typeof bot.say === 'function') bot.say(chosenQuote);
          bot.speech = chosenQuote;
          bot.bubbleText = chosenQuote;

          // Dispatch 3D spot waypoint movement if office has spot definitions
          if (office && typeof bot.goTo === 'function') {
            if (newState === 'recent') {
              bot.goTo('coffee');
            } else if (newState === 'idle') {
              bot.goTo(botId === 'devin' || botId === 'raka' ? 'game' : 'lounge');
            } else if (newState === 'working') {
              bot.goTo('desk');
            }
          }
        }
      }

      if (bot.state === 'blocked') currentBlockedCount++;
      if (bot.state !== 'offline') activeCount++;
    });

    metrics.activeAgents = activeCount || botList.length || 6;
    metrics.totalAgents = botList.length || 6;
    metrics.approvals = currentBlockedCount;
    metrics.tokenCost = +(metrics.tokenCost + 0.01).toFixed(2);

    // Randomize realistic CPU load
    const cpuLoad = Math.floor(20 + Math.random() * 18);
    metrics.vpsHealth = `99.9% · ${cpuLoad}% CPU`;

    if (typeof updateHUD === 'function') {
      updateHUD(metrics);
    }

    return metrics;
  };

  const scheduleNext = () => {
    if (!isRunning) return;
    const delay = isDemoMode ? Math.max(1500, intervalMs / 3) : intervalMs;
    timerId = setTimeout(() => {
      tick();
      scheduleNext();
    }, delay);
  };

  // Initial scheduling
  scheduleNext();

  return {
    stop: () => {
      isRunning = false;
      if (timerId) clearTimeout(timerId);
    },
    tick,
    getState: () => ({ isRunning, isDemoMode, metrics }),
    setDemoMode: (val) => {
      isDemoMode = Boolean(val);
      if (timerId) clearTimeout(timerId);
      scheduleNext();
    },
    metrics,
    approveTask: (botId) => {
      const botList = getBotsList();
      const target = botList.find(b => b.id === botId);
      if (target && target.state === 'blocked') {
        target.state = 'working';
        metrics.approvals = Math.max(0, metrics.approvals - 1);
        metrics.tasksCompleted += 1;
        if (typeof updateHUD === 'function') updateHUD(metrics);
      }
    }
  };
}

  tickScreens(textures.SCREEN);
  tickGame(textures.SCREEN);
}, 450);
setInterval(() => {
  tickEcg(textures.SCREEN);
}, 100);

// Main 60 FPS Render Loop
let lastTime = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  controls.update();

  // Update animated LEDs
  if (office.animatedLeds && Math.random() < 0.25) {
    const led = office.animatedLeds[Math.floor(Math.random() * office.animatedLeds.length)];
    if (led && led.color) {
      led.color.setHex(Math.random() < 0.1 ? 0xff5252 : 0x35e07a);
    }
  }

  // Update all agent animations & walking cycles
  bots.forEach(bot => {
    bot.update(dt);
  });

  // Update superpowers spawner portal effects and despawn transitions
  if (spawner && typeof spawner.update === 'function') {
    spawner.update(dt);
  }

  renderer.render(scene, camera);
  labelR.render(scene, camera);
}
requestAnimationFrame(animate);

console.log("AI Agent Virtual Office 3D Initialized Successfully!");
</script>
